goal: Create, read, and delete a Social Network setting

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Social tab
    action: click
    locator: "getByRole('tab', { name: /Social/i })"

  - intent: Add a social network
    action: click
    locator: "getByRole('button', { name: 'Add Social Network' })"

  - intent: Open the platform selector
    action: click
    locator: "getByRole('button', { name: 'Select Platform' }).last()"

  - intent: Select Pinterest as the E2E platform
    action: click
    locator: "getByText('Pinterest', { exact: true }).last()"

  - intent: Save the social network
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).last()"

  - intent: Return to the Social tab after settings refresh
    action: click
    locator: "getByRole('tab', { name: /Social/i })"

  - VERIFY: The Pinterest network is visible
    js: "await expect(page.getByText('Pinterest', { exact: true }).last()).toBeVisible()"

  - intent: Remove the E2E social network
    action: click
    locator: "locator('button[title=\"Remove Network\"]').last()"

  - intent: Confirm deletion of the social network
    action: click
    locator: "getByRole('button', { name: 'Delete' })"
