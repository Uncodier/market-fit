goal: Complete CRUD cycle for a Promotion

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /promotions
  - intent: Click Create Promotion in the top bar
    action: click
    locator: "getByRole('button', { name: 'Create Promotion' })"

  - intent: Type a new campaign name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select campaign...')"
    value: "Automated Promo Campaign"

  - intent: Create the campaign on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Promo Campaign\"')"

  - intent: Fill the promotion name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Promotion"

  - intent: Submit the create promotion form
    action: click
    locator: "getByRole('button', { name: 'Create promotion' })"

  - WAIT_UNTIL: The promotion details page is open
    js: "page.url().includes('/promotions/') && !page.url().endsWith('/promotions')"
    timeout_seconds: 15

  - intent: Update the promotion name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Promotion - Edited"

  - intent: Save the promotion changes
    action: click
    locator: "getByRole('button', { name: 'Save Changes' })"

  - WAIT_UNTIL: A saved toast or the edited name is visible
    js: "page.getByText('Automated Test Promotion - Edited').count() > 0"
    timeout_seconds: 10

  - description: Accept the native confirm dialog for promotion delete
    js: "page.once('dialog', (dialog) => dialog.accept())"

  - intent: Click Delete Promotion in the danger zone
    action: click
    locator: "getByRole('button', { name: 'Delete Promotion' })"

  - WAIT_UNTIL: The user is back on the promotions list
    js: "page.url().endsWith('/promotions')"
    timeout_seconds: 15

  - VERIFY: The edited promotion is gone from the list
    js: "expect(page.getByText('Automated Test Promotion - Edited')).toHaveCount(0)"
