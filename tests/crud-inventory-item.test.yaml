goal: Complete CRUD cycle for a Inventory Item

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /inventory
  - intent: Click New item in the top bar
    action: click
    locator: "getByRole('button', { name: 'New item' })"

  - intent: Fill the inventory item name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Inventory Item"

  - intent: Submit the create inventory item form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The inventory item details page is open
    js: "await page.url().includes('/inventory/') && !page.url().endsWith('/inventory')"
    timeout_seconds: 15

  - VERIFY: The created inventory item name is visible
    js: "await expect(page.getByText('Automated Test Inventory Item').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/inventory')"
    timeout_seconds: 15

  - VERIFY: The inventory item is gone from the list
    js: "await expect(page.getByText('Automated Test Inventory Item')).toHaveCount(0)"
