goal: Read inventory levels and locations

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /inventory
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/inventory')"
    timeout_seconds: 15

  - VERIFY: The Stock Levels tab is visible
    js: "await expect(page.getByRole('tab', { name: 'Stock Levels' })).toBeVisible()"

  - intent: Open inventory locations
    action: click
    locator: "getByRole('tab', { name: 'Locations' })"

  - VERIFY: The locations section is visible
    js: "await expect(page.getByText('Physical Locations')).toBeVisible()"
