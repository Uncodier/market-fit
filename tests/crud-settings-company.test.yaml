goal: Update and restore Company settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Company tab
    action: click
    locator: "getByRole('tab', { name: /Company/i })"

  - description: Preserve and update the company profile
    js: |
      const field = page.locator('textarea').first();
      const original = await field.inputValue();
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:company', value), original);
      await field.fill(`${original} [Shiplight E2E]`);

  - intent: Save the updated Company settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"

  - WAIT_UNTIL: The Company settings save completes
    js: "await page.waitForTimeout(1000)"
    timeout_seconds: 5

  - intent: Return to the Company tab after settings refresh
    action: click
    locator: "getByRole('tab', { name: /Company/i })"

  - description: Restore the original company profile
    js: |
      const field = page.locator('textarea').first();
      const original = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:company') || '');
      await field.fill(original);

  - intent: Save the restored Company settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"
