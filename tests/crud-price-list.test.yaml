goal: Create, read, and update a run-owned Price List; remove only that fixture in teardown
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Register run-owned fixture names before any creation
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('priceListEditedName', `Shiplight Price List ${runId} Edited`);
      testContext.set('priceListName', `Shiplight Price List ${runId}`);
      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'priceList', [testContext.get('priceListEditedName'), testContext.get('priceListName')]);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - URL: /price-lists
  - intent: Open the Create List dialog
    action: click
    locator: "getByRole('button', { name: 'Create List', exact: true }).first()"
  - intent: Fill the run-owned price list name
    action: fill
    locator: locator('#price-list-name')
    value: "{{priceListName}}"
  - intent: Create the run-owned price list
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: 'Create List', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.getByText(testContext.get('priceListName')).count() > 0), { timeout: 15000 }).toBe(true);"
    description: The new price list appears in the list
  - description: Open the price list details page
    js: "await page.getByText(`${testContext.get('priceListName')}`, { exact: true }).first().click();"
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/price-lists/') && !page.url().endsWith('/price-lists')), { timeout: 10000 }).toBe(true);"
    description: The price list details route is open
  - intent: Open the Edit list dialog from the top bar
    action: click
    locator: "getByRole('button', { name: 'Edit list' })"
  - description: Remember the exact created entity ID and URL for teardown
    js: |-
      testContext.set('priceListUrl', page.url());
      await require(process.cwd() + '/tests/support/mutation-fixtures').remember(testContext, 'priceList');
  - intent: Update the price list name
    action: fill
    locator: locator('#price-list-name')
    value: "{{priceListEditedName}}"
  - intent: Save the edited price list
    action: click
    locator: "getByRole('button', { name: 'Save' })"
  - js: "await expect.poll(async () => Boolean(await page.getByText(testContext.get('priceListEditedName')).count() > 0), { timeout: 10000 }).toBe(true);"
    description: The edited name is visible
  - description: Reload the created entity before checking persistence
    js: await page.reload();
  - js: await expect(page.getByText(testContext.get('priceListEditedName')).first()).toBeVisible()
    description: The edited price list name is visible persists after reload
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'priceList', testContext.get('priceListEditedName'));
tags:
  - regression
  - mutation
teardown:
  - description: Clean up exact run-scoped entities and dependencies even after failure
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/price-lists');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
