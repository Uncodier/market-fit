goal: Create, read, and update a Price List (lists have no delete control)

statements:
  - URL: /projects

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /price-lists
  - intent: Click Create List in the top bar
    action: click
    locator: "getByRole('button', { name: 'Create List' })"

  - intent: Fill the price list name
    action: fill
    locator: "locator('#price-list-name')"
    value: "Automated Test Price List"

  - intent: Submit the create list form
    action: click
    locator: "getByRole('button', { name: 'Create List' }).last()"

  - WAIT_UNTIL: The new price list appears in the list
    js: "page.getByText('Automated Test Price List').count() > 0"
    timeout_seconds: 15

  - intent: Open the price list details page
    action: click
    locator: "getByText('Automated Test Price List').first()"

  - WAIT_UNTIL: The price list details route is open
    js: "page.url().includes('/price-lists/') && !page.url().endsWith('/price-lists')"
    timeout_seconds: 10

  - intent: Open the Edit list dialog from the top bar
    action: click
    locator: "getByRole('button', { name: 'Edit list' })"

  - intent: Update the price list name
    action: fill
    locator: "locator('#price-list-name')"
    value: "Automated Test Price List - Edited"

  - intent: Save the edited price list
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The edited name is visible
    js: "page.getByText('Automated Test Price List - Edited').count() > 0"
    timeout_seconds: 10

  - VERIFY: The edited price list name is visible
    js: "await expect(page.getByText('Automated Test Price List - Edited').first()).toBeVisible()"
