goal: Create when needed, read, update, and restore a Price List

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /price-lists
  - description: Create the reusable E2E price list when it does not exist
    js: |
      const existing = page.getByText('Automated Test Price List', { exact: true });
      if ((await existing.count()) === 0) {
        await page.getByRole('button', { name: 'Create List' }).first().evaluate((button) => button.click());
        await page.locator('#price-list-name').fill('Automated Test Price List');
        await page.getByRole('button', { name: 'Create List' }).last().click();
      }

  - WAIT_UNTIL: The new price list appears in the list
    js: "await page.getByText('Automated Test Price List').count() > 0"
    timeout_seconds: 15

  - intent: Open the price list details page
    action: click
    locator: "getByText('Automated Test Price List', { exact: true }).first()"

  - WAIT_UNTIL: The price list details route is open
    js: "await page.url().includes('/price-lists/') && !page.url().endsWith('/price-lists')"
    timeout_seconds: 10

  - intent: Open the Edit list dialog from the top bar
    action: click
    locator: "getByRole('button', { name: 'Edit list' })"

  - intent: Update the price list name
    action: fill
    locator: "locator('#price-list-name')"
    value: "Automated Test Price List - Edited"

  - intent: Save the edited price list
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The edited name is visible
    js: "await page.getByText('Automated Test Price List - Edited').count() > 0"
    timeout_seconds: 10

  - VERIFY: The edited price list name is visible
    js: "await expect(page.getByText('Automated Test Price List - Edited').first()).toBeVisible()"

  - intent: Reopen the Edit list dialog
    action: click
    locator: "getByRole('button', { name: 'Edit list' })"

  - intent: Restore the reusable price list name
    action: fill
    locator: "locator('#price-list-name')"
    value: "Automated Test Price List"

  - intent: Save the restored price list
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - VERIFY: The original price list name is restored
    js: "await expect(page.getByText('Automated Test Price List', { exact: true }).first()).toBeVisible()"
