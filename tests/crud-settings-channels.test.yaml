goal: Update and restore Channels settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Channels tab
    action: click
    locator: "getByRole('tab', { name: /Channels/i })"

  - description: Preserve the visitor tracking state
    js: |
      const toggle = page.locator('#website-channel').getByRole('switch').first();
      const original = await toggle.getAttribute('data-state');
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:channels', value || 'unchecked'), original);

  - intent: Toggle visitor tracking
    action: click
    locator: "locator('#website-channel').getByRole('switch').first()"

  - intent: Save the updated Channels settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"

  - WAIT_UNTIL: The Channels settings save completes
    js: "await page.waitForTimeout(1000)"
    timeout_seconds: 5

  - URL: /settings?tab=channels

  - description: Restore visitor tracking
    js: |
      const toggle = page.locator('#website-channel').getByRole('switch').first();
      const original = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:channels') || 'unchecked');
      if ((await toggle.getAttribute('data-state')) !== original) await toggle.click();

  - intent: Save the restored Channels settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"
