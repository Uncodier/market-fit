goal: Complete CRUD cycle for Content

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /content
  - intent: Click New Content in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Content' })"

  - intent: Fill the content title
    action: fill
    locator: "locator('#title')"
    value: "Automated Test Content"

  - intent: Fill the content description
    action: fill
    locator: "locator('#description')"
    value: "Automated Test Content Description"

  - intent: Fill the main content text
    action: fill
    locator: "locator('#text')"
    value: "Automated Test Content Text Body"

  - intent: Submit the create content form
    action: click
    locator: "getByRole('button', { name: 'Create Content' })"

  - WAIT_UNTIL: The create content modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new content appears in the list
    js: "await page.getByText('Automated Test Content').count() > 0"
    timeout_seconds: 15

  - intent: Open the content details page
    action: click
    locator: "getByText('Automated Test Content').first()"

  - WAIT_UNTIL: The content details route is open and loaded
    js: "await page.url().includes('/content/') && !page.url().endsWith('/content')"
    timeout_seconds: 15

  - intent: Click the Details tab
    action: click
    locator: "getByRole('tab', { name: 'Details' })"

  - intent: Update the content title
    action: fill
    locator: "locator('input[placeholder=\"Enter title\"]')"
    value: "Automated Test Content - Edited"

  - intent: Save the content
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The edited title is visible
    js: "await page.getByDisplayValue('Automated Test Content - Edited').count() > 0"
    timeout_seconds: 10
