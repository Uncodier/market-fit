goal: Read buyer pages as TEST_BUYER_EMAIL without claiming record ownership isolation

statements:
  - description: Require the configured buyer identity and start read observation
    js: |
      const { requiredReadFixture } = require(process.cwd() + '/tests/support/read-assertions');
      const { startReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      requiredReadFixture('TEST_BUYER_EMAIL');
      startReadObservation(page);

  - description: Navigate to /buyer/profile on TEST_COMMERCE_BASE_URL and require its completed read
    js: |
      const { commerceUrl } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { assertBuyerRead } = require(process.cwd() + '/tests/support/read-buyer');
      const response = await page.goto(commerceUrl('/buyer/profile'), { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertBuyerRead(page, '/buyer/profile');

