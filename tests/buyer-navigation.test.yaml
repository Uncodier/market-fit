goal: Smoke test the authenticated Buyer workspace

statements:
  - URL: /buyer
  - VERIFY: Buyer home renders the Buyer workspace
    js: |
      await expect(page).toHaveURL(/\/buyer$/);
      await expect(page.locator('main').first()).toBeVisible();
      await expect(page.locator('input[name="email"]')).toHaveCount(0);

  - URL: /buyer/orders
  - VERIFY: Buyer orders remain in the Buyer workspace
