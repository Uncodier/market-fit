goal: Create, read, and delete a run-owned printer
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID before navigation and register a unique run
    js: |-
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('collectionName', `Shiplight printer ${runId}`);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the UI account and fixture backend before any mutation
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - description: Wait for the real collection data before creation
    js: await require(process.cwd() + '/tests/support/mutation-collections').prepareCollection(page, testContext, 'printer');
  - intent: Add a printer
    action: click
    locator: "getByRole('button', { name: 'Add printer' }).first()"
  - description: Configure only the new printer card without connecting hardware
    js: |-
      const section = page.locator('#printers');
      const card = section.locator('[id^="printer-"]').filter({ has: page.getByText('Printer', { exact: true }) });
      await expect(card).toHaveCount(1);
      testContext.set('collectionId', await card.getAttribute('id'));
      await card.locator('input:not([type])').fill(testContext.get('collectionName'));
      await card.getByRole('combobox').first().click();
      await page.getByRole('option', { name: 'System (print dialog)', exact: true }).click();
  - intent: Save the printer
    action: click
    locator: "locator('#printers').getByRole('button', { name: 'Save', exact: true }).last()"
  - js: "await expect(page.getByText('Printer settings saved')).toBeVisible({ timeout: 15000 })"
    description: The printer save completes
  - URL: /settings?tab=printers
  - js: "await expect(page.getByText(testContext.get('collectionName'), { exact: true })).toBeVisible()"
    description: The printer persists after reload
  - description: Reload and prove the created run-owned entity persists, saving its ID when exposed
    js: |-
      await page.reload();
      await require(process.cwd() + '/tests/support/mutation-collections').rememberCollection(page, testContext, 'printer');
  - description: Delete only the run-owned entity and assert absence after reload
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'printer', true);
tags:
  - regression
  - mutation
teardown:
  - description: Cleanup only this run-owned entity even when an earlier assertion fails
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'printer');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
