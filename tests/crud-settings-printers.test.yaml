goal: Complete create, read, and delete cycle for a Printer setting

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings?tab=printers
  - WAIT_UNTIL: The Printers settings are loaded
    js: "await page.getByRole('heading', { name: 'Printers' }).count() > 0"
    timeout_seconds: 15

  - intent: Add a printer
    action: click
    locator: "getByRole('button', { name: 'Add printer' }).first()"

  - description: Configure the E2E printer without connecting hardware
    js: |
      const section = page.locator('#printers');
      await expect(section.getByText('Printer', { exact: true }).last()).toBeVisible();
      if ((await section.getByRole('button', { name: 'Save', exact: true }).count()) === 0) {
        await section.getByText('Printer', { exact: true }).last().click();
      }
      await section.locator('input:not([type])').last().fill('Shiplight E2E Printer');
      await section.getByRole('combobox').first().click();
      await page.getByRole('option', { name: 'System (print dialog)' }).click();

  - intent: Save the printer
    action: click
    locator: "locator('#printers').getByRole('button', { name: 'Save', exact: true }).last()"

  - VERIFY: The printer save completes
    js: "await expect(page.getByText('Printer settings saved')).toBeVisible({ timeout: 15000 })"

  - URL: /settings?tab=printers
  - VERIFY: The printer persists after reload
    js: "await expect(page.getByText('Shiplight E2E Printer', { exact: true })).toBeVisible()"

  - description: Expand and remove the E2E printer
    js: |
      const section = page.locator('#printers');
      if ((await section.getByRole('button', { name: 'Remove printer' }).count()) === 0) {
        await section.getByText('Shiplight E2E Printer', { exact: true }).click();
      }
      await section.getByRole('button', { name: 'Remove printer' }).last().click();

  - intent: Persist the printer deletion
    action: click
    locator: "getByRole('button', { name: 'Save', exact: true }).last()"

  - VERIFY: The printer deletion save completes
    js: "await expect(page.getByText('Printer settings saved')).toBeVisible({ timeout: 15000 })"

  - URL: /settings?tab=printers
  - VERIFY: The E2E printer is removed
    js: "await expect(page.getByText('Shiplight E2E Printer', { exact: true })).toHaveCount(0)"
