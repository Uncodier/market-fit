goal: Create, read, and delete a run-owned team invitation in a disposable mail sink
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID before navigation and register a unique run
    js: |-
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('collectionName', `Shiplight team ${runId}`);
      const sink = require(process.cwd() + '/tests/support/mutation-safety').invitationDomain();
      testContext.set('collectionName', 'shiplight-e2e-' + runId + '@' + sink);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the UI account and fixture backend before any mutation
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - description: Wait for the real collection data before creation
    js: await require(process.cwd() + '/tests/support/mutation-collections').prepareCollection(page, testContext, 'team');
  - intent: Click Add Team Member button
    action: click
    locator: "getByRole('button', { name: 'Invite New Member to Team' })"
  - description: Fill the explicitly configured disposable invitation sink
    js: await page.getByPlaceholder('Email address').fill(testContext.get('collectionName'));
  - intent: Save and invite only the run-specific disposable recipient
    action: click
    locator: "getByRole('button', { name: 'Save & Invite', exact: true })"
  - description: Require invitation completion and reject delivery errors even when a member row was inserted
    js: |-
      await expect(page.getByText('Successfully added 1 team member(s)!', { exact: true })).toBeVisible();
      await expect(page.locator('[data-sonner-toast][data-type="error"]')).toHaveCount(0);
      await expect(page.getByText(/Member added but invitation failed|Failed to save/)).toHaveCount(0);
  - description: Reload and prove the created run-owned entity persists, saving its ID when exposed
    js: |-
      await page.reload();
      await require(process.cwd() + '/tests/support/mutation-collections').rememberCollection(page, testContext, 'team');
  - description: Delete only the run-owned entity and assert absence after reload
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'team', true);
tags:
  - regression
  - mutation
teardown:
  - description: Cleanup only this run-owned entity even when an earlier assertion fails
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'team');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
