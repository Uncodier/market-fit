goal: Complete CRUD cycle for a Team Member in Settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Team tab
    action: click
    locator: "getByRole('tab', { name: /Team|Equipo/i })"

  - intent: Click Add Team Member button
    action: click
    locator: "getByRole('button', { name: 'Invite New Member to Team' })"

  - description: Fill a unique invitation email
    js: |
      const email = `shiplight-e2e-${Date.now()}@example.com`;
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:team-email', value), email);
      const field = page.getByPlaceholder('Email address').first();
      await field.click();
      await field.pressSequentially(email, { delay: 10 });
      await field.blur();

  - WAIT_UNTIL: The invitation is ready to save
    js: "await page.getByRole('button', { name: 'Save & Invite' }).first().isEnabled()"
    timeout_seconds: 10

  - intent: Click Invite
    action: click
    locator: "getByRole('button', { name: 'Save & Invite' }).first()"

  - WAIT_UNTIL: The invitation save has finished
    js: "await page.getByRole('button', { name: 'Save & Invite' }).count() === 0"
    timeout_seconds: 30

  - VERIFY: The team member is visible in the list
    js: |
      const email = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:team-email'));
      await expect(page.locator(`input[value="${email}"]`)).toBeVisible();

  - description: Click Remove on the E2E member row
    js: |
      const email = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:team-email'));
      const member = page.locator(`input[value="${email}"]`);
      const card = page.locator('[id^="team-member-"]').filter({ has: member });
      await expect(card).toHaveCount(1);
      await card.getByRole('button', { name: 'Remove', exact: true }).click();

  - WAIT_UNTIL: The delete confirmation modal is open
    js: "await page.getByRole('alertdialog').count() > 0"
    timeout_seconds: 5

  - intent: Confirm deletion
    action: click
    locator: "getByRole('alertdialog').getByRole('button', { name: 'Remove', exact: true })"

  - VERIFY: The E2E team member is removed
    js: |
      const email = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:team-email'));
      await expect(page.locator(`input[value="${email}"]`)).toHaveCount(0);
