goal: Read, update, and restore the explicitly selected agent name
tags:
  - regression
  - mutation
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID on a disposable mutation target before navigation
    js: |-
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      const agentId = require(process.cwd() + '/tests/support/mutation-safety').requireUuid(require(process.cwd() + '/tests/support/mutation-safety').required(process.env, 'TEST_AGENT_ID'), 'TEST_AGENT_ID');
      const { client, siteId } = await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const fixture = await client.from('agents').select('id').eq('site_id', siteId).eq('id', agentId).single();
      if (fixture.error || !fixture.data) throw new Error('TEST_AGENT_ID is unavailable in the explicitly selected site');
      testContext.set('agentUrl', '/agents/' + agentId);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind UI and fixture backend before editing the selected agent
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - description: Capture the original agent value before editing, save, and assert persistence after reload
    js: await require(process.cwd() + '/tests/support/mutation-settings').updateField(page, testContext, 'agent');
teardown:
  - description: Restore only the captured original in teardown even after failure; assert restoration after reload
    js: await require(process.cwd() + '/tests/support/mutation-settings').restoreField(page, testContext);
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
