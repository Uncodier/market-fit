goal: Complete create, read, update, and archive cycle for a Catalog item
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - URL: /projects
  - description: Select the configured test project
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("catalogProductName", `Shiplight Catalog Product ${runId}`);
      testContext.set("catalogProductEditedName", `Shiplight Catalog Product ${runId} Edited`);
      testContext.set("catalogSku", `SL-${runId}`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      const categoryName = process.env.TEST_CATALOG_CATEGORY_NAME;
      if (!categoryName) throw new Error("TEST_CATALOG_CATEGORY_NAME is required");
      testContext.set("catalogCategoryName", categoryName);
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);

      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'catalog', [testContext.get('catalogProductName'), testContext.get('catalogProductEditedName')]);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/robots')), { timeout: 5000 }).toBe(true);"
    description: The user is navigated to the default project page
  - URL: /catalog
  - intent: Click the Add Item button to open the creation dialog
    action: click
    locator: "getByRole('button', { name: 'Add item', exact: true })"
  - intent: Filter the dependency selector by the configured category
    action: fill
    locator: getByPlaceholder('Select category...')
    value: "{{catalogCategoryName}}"
  - js: "await expect.poll(async () => Boolean((await page.locator('[data-relation-id]').filter({ hasText: testContext.get('catalogCategoryName') }).count()) > 0), { timeout: 5000 }).toBe(true);"
    description: The configured category option is visible
  - description: Select the configured catalog category
    js: |-
      const option = page.locator('[data-relation-id]').filter({ has: page.getByText(testContext.get('catalogCategoryName'), { exact: true }) });
      await expect(option).toHaveCount(1);
      await option.click();
  - intent: Fill in the product name
    action: fill
    locator: locator('input[name="name"]')
    value: "{{catalogProductName}}"
  - description: Fill in the SKU with a unique value
    js: await page.locator('input[name="sku"]').fill(testContext.get('catalogSku'))
  - intent: Fill in the target sale price
    action: fill
    locator: locator('input[name="target_sale_price"]')
    value: "99.99"
  - intent: Click the Create item button
    action: click
    locator: "getByRole('button', { name: 'Create item', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('dialog').count() === 0), { timeout: 10000 }).toBe(true);"
    description: The create catalog item modal closes
  - js: "await expect.poll(async () => Boolean((await page.getByText(testContext.get('catalogProductName'), { exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The new product appears in the list
  - description: Open the run-scoped catalog item details
    js: |
      const productName = testContext.get("catalogProductName");
      await page.getByRole('row').filter({ hasText: productName }).getByRole('link').first().click();
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/catalog/') && !page.url().endsWith('/catalog')), { timeout: 15000 }).toBe(true);"
    description: The details page is open and loaded
  - js: await expect(page.locator('input[name="name"]')).toHaveValue(testContext.get('catalogProductName'))
    description: The details page shows the correct product name
  - intent: Update the product name in the details form
    action: fill
    locator: locator('input[name="name"]')
    value: "{{catalogProductEditedName}}"
  - intent: Click the Save button
    action: click
    locator: "getByRole('button', { name: 'Save', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.getByText('Saved successfully').count() > 0), { timeout: 10000 }).toBe(true);"
    description: The catalog item update succeeds
  - description: Reload the details page to verify the update persisted
    js: await page.reload()
  - js: await expect(page.locator('input[name="name"]')).toHaveValue(testContext.get('catalogProductEditedName'))
    description: The edited product name persists after reload
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'catalog', testContext.get('catalogProductEditedName'));
  - intent: Archive the product using the available catalog removal action
    action: click
    locator: "getByRole('button', { name: 'Archive Product', exact: true }).first()"
  - intent: Confirm the product archive
    action: click
    locator: "getByRole('button', { name: 'Archive Product', exact: true }).last()"
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/catalog')), { timeout: 15000 }).toBe(true);"
    description: The user is back on the active catalog list
  - description: Reload the catalog before checking active-list visibility
    js: await page.reload()
  - js: "await expect.poll(async () => Boolean(((await page.getByRole('table').count()) > 0 || (await page.getByText('No items found').count()) > 0) && (await page.locator('.animate-pulse:visible').count()) === 0), { timeout: 15000 }).toBe(true);"
    description: The active catalog has finished loading
  - js: "await expect(page.getByText(testContext.get('catalogProductEditedName'), { exact: true })).toHaveCount(0)"
    description: The archived product is absent from the active catalog
  - intent: Show archived catalog items
    action: click
    locator: "getByRole('tab', { name: 'Archived', exact: true })"
  - js: "await expect.poll(async () => Boolean((await page.getByRole('row').filter({ hasText: testContext.get('catalogProductEditedName') }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The archived product appears in the archived catalog
  - js: |
      const archivedRow = page.getByRole('row').filter({ hasText: testContext.get('catalogProductEditedName') });
      await expect(archivedRow).toBeVisible();
      await expect(archivedRow).toContainText('Archived');
    description: The product remains archived rather than being physically deleted
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'catalog');
teardown:
  - description: Cleanup the exact run-scoped fixture journal, including partial failures
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/catalog');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
tags:
  - regression
  - mutation
