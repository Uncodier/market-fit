goal: Complete CRUD (Create, Read, Update, Delete) cycle for a Catalog item

statements:
  # 0. Set site context (just like navigation test)
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  # 1. CREATE
  - URL: /catalog
  - intent: Click the Add Item button to open the creation dialog
    action: click
    locator: "getByRole('button', { name: /Add item|Agregar ítem|Agregar item/i })"

  - intent: Type a new category name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select category...')"
    value: "Automated Catalog Category"

  - WAIT_UNTIL: The category dropdown options are visible
    js: "await page.getByText(/Use \"Automated Catalog Category\"|Automated Catalog Category/).count() > 0"
    timeout_seconds: 5

  - intent: Select or create the category
    action: click
    locator: "getByRole('option', { name: /Use \"Automated Catalog Category\"|Automated Catalog Category/ }).first()"

  - intent: Fill in the product name
    action: fill
    locator: "locator('input[name=\"name\"]')"
    value: "Automated Test Product"

  - description: Fill in the SKU with a unique value
    js: "await page.locator('input[name=\"sku\"]').fill(`TEST-${Date.now()}`)"

  - intent: Fill in the target sale price
    action: fill
    locator: "locator('input[name=\"target_sale_price\"]')"
    value: "99.99"

  - intent: Click the Create item button
    action: click
    locator: "getByRole('button', { name: /Create item|Agregar item/i })"

  - WAIT_UNTIL: The create catalog item modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new product appears in the list
    js: "await page.getByText('Automated Test Product').count() > 0"
    timeout_seconds: 15

  - intent: Open the catalog item details
    action: click
    locator: "getByRole('row', { name: /Automated Test Product/i }).getByRole('link').first()"

  - WAIT_UNTIL: The details page is open and loaded
    js: "await page.url().includes('/catalog/') && !page.url().endsWith('/catalog')"
    timeout_seconds: 15

  # 2. READ / VERIFY
  - VERIFY: The details page shows the correct product name
    js: "await expect(page.locator('input[name=\"name\"]')).toHaveValue('Automated Test Product')"

  # 3. UPDATE
  - intent: Update the product name in the details form
    action: fill
    locator: "locator('input[name=\"name\"]')"
    value: "Automated Test Product - Edited"

  - intent: Click the Save button
    action: click
    locator: "getByRole('button', { name: /Save|Guardar/i }).first()"
