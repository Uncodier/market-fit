goal: Complete CRUD cycle for a Bill

statements:
  - URL: /projects
  - description: Select the configured test project
    js: |
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("billTitle", `Automated Test Bill ${runId}`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      await page.getByRole('button', { name: `Select ${siteName}`, exact: true }).click();

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /bills
  - intent: Click New bill in the top bar
    action: click
    locator: "getByRole('button', { name: 'New bill' })"

  - intent: Fill the bill title
    action: fill
    locator: "getByRole('dialog', { name: 'New vendor bill' }).getByLabel('Title', { exact: true })"
    value: "{{billTitle}}"

  - intent: Fill the line item name
    action: fill
    locator: "getByRole('dialog', { name: 'New vendor bill' }).getByLabel('Name', { exact: true })"
    value: "Test Line Item"

  - intent: Submit the create bill form
    action: click
    locator: "getByRole('button', { name: 'Create bill' })"

  - WAIT_UNTIL: The bill creation completes
    js: "(await page.getByRole('dialog', { name: 'New vendor bill' }).count()) === 0 && /\\/bills\\/[^/]+$/.test(page.url())"
    timeout_seconds: 20

  - VERIFY: The created bill title is visible
    js: "await expect(page.getByText(testContext.get('billTitle'), { exact: true }).first()).toBeVisible()"

  - intent: Click Delete on the bill details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion of the bill
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the bills list
    js: "await page.url().endsWith('/bills')"
    timeout_seconds: 15

  - VERIFY: The bill is gone from the list
    js: "await expect(page.getByText(testContext.get('billTitle'), { exact: true })).toHaveCount(0)"
