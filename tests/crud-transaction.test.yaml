goal: Create, read, and delete a run-owned unposted expense transaction
tags:
  - regression
  - mutation
statements:
  - description: Require an explicit disposable mutation target before navigation
    js: |
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('expenseName', `Shiplight Expense ${runId}`);
      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'transaction', [testContext.get('expenseName')]);
      const account = process.env.TEST_EXPENSE_ACCOUNT_NAME;
      if (!account) throw new Error('TEST_EXPENSE_ACCOUNT_NAME is required; provision a disposable expense account');
      testContext.set('expenseAccount', account);
  - description: Select and verify TEST_SITE_NAME and TEST_SITE_ID
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page)
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - URL: /transactions
  - intent: Open the expense creation dialog
    action: click
    locator: "getByRole('button', { name: 'Add Expense', exact: true })"
  - intent: Fill the amount for the unposted expense
    action: fill
    locator: getByRole('dialog').locator('#amount')
    value: "150"
  - intent: Open the expense account selector
    action: click
    locator: getByRole('dialog').locator('#category')
  - description: Select the explicitly configured expense account
    js: "await page.getByRole('option', { name: testContext.get('expenseAccount'), exact: true }).click()"
  - intent: Fill the run-specific expense description
    action: fill
    locator: getByRole('dialog').locator('#notes')
    value: "{{expenseName}}"
  - intent: Save the unposted expense without publishing to the journal
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: 'Save', exact: true })"
  - description: Require a successful create and remember the exact site-scoped expense ID
    js: |
      await expect(page.getByRole('dialog')).toHaveCount(0);
      await expect(page.getByText(testContext.get('expenseName'), { exact: true })).toBeVisible();
      await expect(page.locator('[data-sonner-toast][data-type="error"]')).toHaveCount(0);
      const id = await require(process.cwd() + '/tests/support/mutation-fixtures').remember(testContext, 'transaction');
      testContext.set('expenseUrl', `/transactions/${id}`);
      await page.goto(testContext.get('expenseUrl'));
      await page.reload();
      await expect(page.getByText(testContext.get('expenseName'), { exact: true })).toBeVisible();
      await expect(page.getByText('$150.00', { exact: true }).first()).toBeVisible();
  - description: Read the exact created site-scoped entity before deletion
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'transaction', testContext.get('expenseName'));
  - URL: /transactions
  - description: Delete only the run-owned expense using the list action
    js: |
      const row = page.getByRole('row').filter({ has: page.getByText(testContext.get('expenseName'), { exact: true }) });
      await expect(row).toHaveCount(1);
      await row.getByRole('button', { name: 'Open menu', exact: true }).click();
  - description: Accept only the expected expense deletion confirmation
    js: |-
      page.once('dialog', async dialog => {
        if (dialog.type() !== 'confirm' || !/delete this expense/i.test(dialog.message())) { await dialog.dismiss(); throw new Error('Unexpected expense confirmation'); }
        await dialog.accept();
      });
  - intent: Delete the unposted expense
    action: click
    locator: "getByRole('menuitem', { name: 'Delete', exact: true })"
  - description: Require deletion success and a loaded list after reload
    js: |
      await expect(page.getByText('Expense deleted successfully', { exact: true })).toBeVisible();
      await page.reload();
      await expect(page.getByRole('button', { name: 'Add Expense', exact: true })).toBeVisible();
      await expect(page.locator('.animate-pulse:visible')).toHaveCount(0);
      await expect(page.getByText(testContext.get('expenseName'), { exact: true })).toHaveCount(0);
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'transaction');
teardown:
  - description: Remove only the exact run-owned expense even when a preceding assertion fails
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext)
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
