goal: Complete CRUD cycle for an Expense transaction

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /transactions
  - intent: Click Add Expense in the top bar
    action: click
    locator: "getByRole('button', { name: 'Add Expense' })"

  - intent: Fill the required expense amount
    action: fill
    locator: "locator('#amount')"
    value: "100.50"

  - intent: Fill the expense notes used as description
    action: fill
    locator: "locator('#notes')"
    value: "Automated Test Expense"

  - intent: Type a new campaign name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select campaign (optional)')"
    value: "Automated Expense Campaign"

  - intent: Create the campaign on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Expense Campaign\"')"

  - intent: Save the new expense
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The new expense appears in the list
    js: "page.getByText('Automated Test Expense').count() > 0"
    timeout_seconds: 15

  - intent: Open the expense details page
    action: click
    locator: "getByText('Automated Test Expense').first()"

  - WAIT_UNTIL: The transaction details route is open
    js: "page.url().includes('/transactions/') && !page.url().endsWith('/transactions')"
    timeout_seconds: 10

  - VERIFY: The expense notes are visible
    js: "expect(page.getByText('Automated Test Expense').first()).toBeVisible()"

  - intent: Click Delete on the expense details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion of the expense
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the transactions list
    js: "page.url().endsWith('/transactions')"
    timeout_seconds: 15

  - VERIFY: The expense is gone from the list
    js: "expect(page.getByText('Automated Test Expense')).toHaveCount(0)"
