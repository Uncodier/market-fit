goal: Complete CRUD cycle for an Expense transaction

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - description: Reset expenses for test
    js: |
      const { createClient } = require('@supabase/supabase-js');
      const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
      const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
      if (supabaseUrl && supabaseKey) {
        const supabase = createClient(supabaseUrl, supabaseKey);
        await supabase.from('transactions').delete().like('description', '%Automated Test Expense%');
      }
      await page.goto('/projects');
      await page.waitForLoadState('networkidle');
      await page.goto('/transactions');
      await page.waitForLoadState('networkidle');
      await page.waitForTimeout(5000);

  - URL: /transactions
  - intent: Click Add Expense in the top bar
    action: click
    locator: "getByRole('button', { name: 'Add Expense' })"

  - intent: Fill the required expense amount
    action: fill
    locator: "locator('input#amount')"
    value: "150.00"
    
  - description: Blur the amount input to trigger validation
    js: "await page.locator('input#amount').first().blur();"

  - description: Wait for category dropdown to load
    js: "await page.waitForTimeout(2000)"

  - description: Ensure category is selected
    js: "await page.locator('div[role=\"dialog\"] button[id=\"category\"]').first().click(); await page.locator('div[role=\"option\"]').first().click();"

  - intent: Fill the expense notes used as description
    action: fill
    locator: "locator('textarea#notes')"
    value: "Automated Test Expense 56"

  - intent: Type a new campaign name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select campaign (optional)')"
    value: "Automated Expense Campaign"

  - WAIT_UNTIL: The campaign dropdown options are visible
    js: "await page.locator('.cursor-pointer.font-inter').filter({ hasText: 'Automated Expense Campaign' }).count() > 0"
    timeout_seconds: 10

  - description: Click the create campaign button
    js: |
      const createOption = page.locator('.cursor-pointer.font-inter').filter({ hasText: /Use \"Automated Expense Campaign\"|Usar \"Automated Expense Campaign\"/i });
      if (await createOption.count() > 0) {
        await createOption.first().click();
      } else {
        const option = page.locator('.cursor-pointer.font-inter').filter({ hasText: 'Automated Expense Campaign' });
        if (await option.count() > 0) {
           await option.first().click();
        }
      }
    
  - description: Wait for the campaign to be selected
    js: "await page.waitForTimeout(2000).catch(() => {})"

  - description: Click out to unfocus select input
    js: "await page.locator('div[role=\"dialog\"] h2').first().click(); await page.waitForTimeout(2000);"

  - description: Save the new expense and wait for response
    js: |
      const isValid = await page.evaluate(() => {
        const f = document.querySelector('div[role="dialog"] form');
        if (f) {
           return (f).checkValidity();
        }
        return false;
      });
      console.log('Form validity before save:', isValid);
      if (!isValid) {
         console.log('Form is invalid. HTML5 validation prevented submission.');
         const amountValue = await page.locator('input#amount').inputValue();
         console.log('Amount value:', amountValue);
      }
      
      const clickPromise = page.locator('div[role="dialog"] button').filter({ hasText: /Save|Guardar/i }).first().click();
      
      const toastPromise = page.waitForSelector('li[data-sonner-toast]', { timeout: 15000 }).catch(() => null);
      
      await clickPromise;
      const toastElement = await toastPromise;
      if (toastElement) {
        const toastText = await toastElement.innerText();
        console.log('Toast appeared with text:', toastText);
      } else {
        console.log('No toast appeared after clicking save.');
      }
      
  - WAIT_UNTIL: The create expense modal closes
    js: "await page.locator('div[role=\"dialog\"]').count() === 0"
    timeout_seconds: 60

  - description: Ensure transactions are visible and data is updated
    js: |
      await page.waitForTimeout(5000);
      await page.goto('/projects');
      await page.waitForLoadState('networkidle');
      await page.goto('/transactions');
      await page.waitForLoadState('networkidle');
      await page.waitForTimeout(10000);
    
  - WAIT_UNTIL: The expense appears in the list
    js: "await page.getByText('Automated Test Expense 56').count() > 0"
    timeout_seconds: 60

  - intent: Open the expense details page
    action: click
    locator: "locator('table').getByText('Automated Test Expense 56').first()"

  - WAIT_UNTIL: The transaction details route is open and loaded
    js: "await page.locator('h2:has-text(\"Content Creation\")').isVisible()"
    timeout_seconds: 30

  - VERIFY: The expense amount is visible
    js: "await expect(page.getByText('$150.00').first()).toBeVisible()"

  - intent: Return to transactions list
    action: click
    locator: "getByRole('button', { name: 'Expenses' }).first()"

  - WAIT_UNTIL: The user is back on the transactions list
    js: "await page.getByRole('button', { name: 'Add Expense' }).count() > 0"
    timeout_seconds: 30

  - description: Setup dialog handler for deletion and confirm
    js: "page.once('dialog', async dialog => { await dialog.accept(); });"

  - description: Click the open menu button on the expense list dropdown
    js: "await page.locator('button:has-text(\"Open menu\")').first().click();"

  - description: Click Delete in the dropdown menu
    js: "await page.locator('text=Delete').last().click();"

  - description: Wait for deletion to complete
    js: "await page.waitForTimeout(2000);"

  - VERIFY: The expense is gone from the list
    js: "await expect(page.getByText('Automated Test Expense 56')).toHaveCount(0)"
