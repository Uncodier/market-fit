goal: Complete CRUD cycle for an Expense transaction

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /transactions
  - intent: Click Add Expense in the top bar
    action: click
    locator: "getByRole('button', { name: 'Add Expense' })"

  - intent: Fill the required expense amount
    action: fill
    locator: "locator('#amount')"
    value: "100.50"

  - intent: Fill the expense notes used as description
    action: fill
    locator: "locator('#notes')"
    value: "Automated Test Expense"

  - intent: Type a new campaign name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select campaign (optional)')"
    value: "Automated Expense Campaign"

  - WAIT_UNTIL: The campaign dropdown options are visible
    js: "await page.getByText(/Use \"Automated Expense Campaign\"|Automated Expense Campaign/).count() > 0"
    timeout_seconds: 5

  - intent: Create the campaign on the fly with Use
    action: click
    locator: "getByText(/Use \"Automated Expense Campaign\"|Automated Expense Campaign/).first()"

  - intent: Save the new expense
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The create expense modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new expense appears in the list
    js: "await page.getByText('Automated Test Expense').count() > 0"
    timeout_seconds: 15

  - intent: Open the expense details page
    action: click
    locator: "getByText('Automated Test Expense').first()"

  - WAIT_UNTIL: The transaction details route is open and loaded
    js: "await page.getByText('Automated Test Expense').first().isVisible()"
    timeout_seconds: 15

  - VERIFY: The expense notes are visible
    js: "await expect(page.getByText('Automated Test Expense').first()).toBeVisible()"

  - intent: Return to transactions list
    action: click
    locator: "getByRole('link', { name: 'Transactions' }).first()"

  - WAIT_UNTIL: The user is back on the transactions list
    js: "await page.url().endsWith('/transactions')"
    timeout_seconds: 15

  - WAIT_UNTIL: The expense appears in the list
    js: "await page.getByText('Automated Test Expense').count() > 0"
    timeout_seconds: 15

  - description: Setup dialog handler for deletion
    js: "page.on('dialog', dialog => dialog.accept());"

  - intent: Click the open menu button on the expense list dropdown
    action: click
    locator: "getByRole('button', { name: /Open menu/ }).first()"

  - intent: Click Delete in the dropdown menu
    action: click
    locator: "getByRole('menuitem', { name: /Delete/i })"

  - description: Wait for deletion to complete
    js: "await page.waitForTimeout(1000);"

  - VERIFY: The expense is gone from the list
    js: "await expect(page.getByText('Automated Test Expense')).toHaveCount(0)"
