goal: Read every reporting dashboard

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The workspace is selected
    js: "await page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /dashboard?tab=performance
  - VERIFY: Performance report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /dashboard?tab=overview
  - VERIFY: Overview report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /dashboard?tab=analytics
  - VERIFY: Analytics report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /dashboard?tab=traffic
  - VERIFY: Traffic report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /dashboard?tab=sales
  - VERIFY: Sales report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /dashboard?tab=social
  - VERIFY: Social report loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"
