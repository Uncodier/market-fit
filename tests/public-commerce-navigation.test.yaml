goal: Read the configured public catalog item, shop, privacy policy and empty checkout

statements:
  - description: Require TEST_SHOP_SLUG, TEST_CATALOG_ITEM_ID, TEST_CATALOG_ITEM_NAME and TEST_COMMERCE_BASE_URL before reading
    js: |
      const { commerceFixtures } = require(process.cwd() + '/tests/support/read-assertions');
      const { startReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      commerceFixtures();
      startReadObservation(page);

  - description: Require the marketplace catalog content on the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { slug, itemId, itemName } = commerceFixtures();
      const target = commerceUrl('/marketplace');
      const response = await page.goto(target, { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, target, catalogItemLink(page, `/marketplace/${itemId}`, itemName));

  - description: Require the marketplace item content on the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { slug, itemId, itemName } = commerceFixtures();
      const target = commerceUrl(`/marketplace/${itemId}`);
      const response = await page.goto(target, { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, target, page.getByRole('heading', { name: itemName, exact: true }));

  - description: Require the storefront catalog content on the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { slug, itemId, itemName } = commerceFixtures();
      const target = commerceUrl(`/shop/${slug}`);
      const response = await page.goto(target, { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, target, catalogItemLink(page, `/shop/${slug}/${itemId}`, itemName));

  - description: Require the storefront privacy policy content on the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { slug, itemId, itemName } = commerceFixtures();
      const target = commerceUrl(`/shop/${slug}/privacy`);
      const response = await page.goto(target, { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, target, page.getByRole('heading', { name: 'Privacy Policy', exact: true }));

  - description: Require the empty checkout content on the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const { slug, itemId, itemName } = commerceFixtures();
      const target = commerceUrl('/cart/checkout');
      const response = await page.goto(target, { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, target, page.getByRole('heading', { name: 'Checkout empty', exact: true }));
      await expect(page.getByText("You don't have any items to checkout.", { exact: true })).toBeVisible();
      await expect(page.getByRole('button', { name: 'Continue Shopping', exact: true })).toBeVisible();

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
