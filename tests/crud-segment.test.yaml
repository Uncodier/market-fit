goal: Complete CRUD cycle for a Segment

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /segments
  - intent: Click New Segment in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Segment' })"

  - intent: Fill the segment name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Segment"

  - intent: Fill the segment description
    action: fill
    locator: "locator('#description')"
    value: "Automated Test Segment Description"

  - intent: Open audience dropdown
    action: click
    locator: "getByRole('combobox').filter({ hasText: 'Select audience type' })"

  - intent: Select audience type
    action: click
    locator: "getByRole('option', { name: 'Technology' })"

  - intent: Open language dropdown
    action: click
    locator: "getByRole('combobox').filter({ hasText: 'Select language' })"

  - intent: Select language
    action: click
    locator: "getByRole('option', { name: 'English' })"

  - intent: Submit the create segment form
    action: click
    locator: "getByRole('button', { name: 'Create Segment' })"

  - WAIT_UNTIL: The new segment appears in the list
    js: "page.getByText('Automated Test Segment').count() > 0"
    timeout_seconds: 15

  - intent: Open the segment details page
    action: click
    locator: "getByText('Automated Test Segment').first()"

  - WAIT_UNTIL: The segment details route is open
    js: "page.url().includes('/segments/') && !page.url().endsWith('/segments')"
    timeout_seconds: 10

  - intent: Update the segment name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Segment - Edited"

  - intent: Save the basic information section
    action: click
    locator: "getByRole('button', { name: 'Save Basic Information' })"

  - WAIT_UNTIL: The save finishes
    js: "page.getByRole('button', { name: 'Save Basic Information' }).count() > 0"
    timeout_seconds: 10

  - intent: Click Delete in the danger zone
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm Delete Segment
    action: click
    locator: "getByRole('button', { name: 'Delete Segment' })"

  - WAIT_UNTIL: The user is back on the segments list
    js: "page.url().endsWith('/segments')"
    timeout_seconds: 15

  - VERIFY: The edited segment is gone from the list
    js: "expect(page.getByText('Automated Test Segment - Edited')).toHaveCount(0)"
