goal: Complete CRUD cycle for a Segment
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Register run-owned fixture names before any creation
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('segmentEditedName', `Shiplight Segment ${runId} Edited`);
      testContext.set('segmentName', `Shiplight Segment ${runId}`);
      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'segment', [testContext.get('segmentEditedName'), testContext.get('segmentName')]);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - URL: /segments
  - intent: Click New Segment in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Segment' })"
  - intent: Fill the segment name
    action: fill
    locator: locator('#name')
    value: "{{segmentName}}"
  - intent: Fill the segment description
    action: fill
    locator: locator('#description')
    value: "{{segmentName}} Description"
  - intent: Open audience dropdown
    action: click
    locator: getByRole('combobox').nth(0)
  - intent: Select audience type
    action: click
    locator: "getByRole('option', { name: 'Technology' })"
  - intent: Open language dropdown
    action: click
    locator: getByRole('combobox').nth(1)
  - intent: Select language
    action: click
    locator: "getByRole('option', { name: 'English' })"
  - intent: Submit the create segment form
    action: click
    locator: "getByRole('button', { name: 'Create Segment' })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('dialog').count() === 0), { timeout: 10000 }).toBe(true);"
    description: The create segment modal closes
  - js: "await expect.poll(async () => Boolean(await page.getByText(testContext.get('segmentName')).count() > 0), { timeout: 15000 }).toBe(true);"
    description: The new segment appears in the list
  - description: Open the segment details page
    js: await page.getByText(`${testContext.get('segmentName')}`).first().click();
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/segments/') && !page.url().endsWith('/segments')), { timeout: 10000 }).toBe(true);"
    description: The segment details route is open
  - intent: Switch to Details tab
    action: click
    locator: "getByRole('tab', { name: 'Details' })"
  - description: Remember the exact created entity ID and URL for teardown
    js: |-
      testContext.set('segmentUrl', page.url());
      await require(process.cwd() + '/tests/support/mutation-fixtures').remember(testContext, 'segment');
  - intent: Update the segment name
    action: fill
    locator: locator('#name')
    value: "{{segmentEditedName}}"
  - intent: Save the basic information section
    action: click
    locator: "getByRole('button', { name: 'Save Basic Information' })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('button', { name: 'Save Basic Information' }).count() > 0), { timeout: 10000 }).toBe(true);"
    description: The save finishes
  - description: Require the saved edit to persist after reload
    js: |-
      await page.reload();
      await page.getByRole('tab', { name: 'Details', exact: true }).click();
      await expect(page.locator('#name')).toHaveValue(testContext.get('segmentEditedName'));
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'segment', testContext.get('segmentEditedName'));
  - intent: Click Delete in the danger zone
    action: click
    locator: "getByRole('button', { name: 'Delete' })"
  - intent: Confirm Delete Segment
    action: click
    locator: "getByRole('button', { name: 'Delete Segment' })"
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/segments')), { timeout: 15000 }).toBe(true);"
    description: The user is back on the segments list
  - js: await expect(page.getByText(testContext.get('segmentEditedName'))).toHaveCount(0)
    description: The edited segment is gone from the list
  - description: Reload the list and wait for loaded data before the final removal check
    js: |-
      await page.goto('/segments');
      await page.reload();
      await expect(page.locator('.animate-pulse:visible')).toHaveCount(0);
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'segment');
tags:
  - regression
  - mutation
teardown:
  - description: Clean up exact run-scoped entities and dependencies even after failure
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/segments');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
