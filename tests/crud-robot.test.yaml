goal: Create, read, and delete a Robot session

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /robots
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/robots')"
    timeout_seconds: 15

  - intent: Create a new Robot session
    action: click
    locator: "locator('button[title=\"Create new agent\"]')"

  - WAIT_UNTIL: The new Robot session is selected
    js: "page.url().includes('instance=') && !page.url().includes('instance=new')"
    timeout_seconds: 15

  - VERIFY: The new Robot session tab is active
    js: "await expect(page.getByRole('tab', { selected: true })).toBeVisible()"

  - intent: Delete the active Robot session
    action: click
    locator: "getByRole('tab', { selected: true }).getByRole('button', { name: 'Delete session' })"

  - intent: Confirm Robot session deletion
    action: click
    locator: "getByRole('button', { name: /Delete|Eliminar/i }).last()"

  - WAIT_UNTIL: The deleted Robot session is no longer selected
    js: "!page.url().includes('instance=') || page.url().includes('instance=new')"
    timeout_seconds: 15
