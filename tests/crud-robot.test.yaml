# Intended journey: create session, capture UUID, verify its tab, delete that exact session, reload.
# Blocked until failed placeholder creation can be cleaned up by exact run ownership.
goal: Create, read, and delete a Robot session
tags:
  - regression
  - mutation
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID and a disposable mutation environment
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Fail closed for the unavailable isolated fixture instead of reporting an empty success
    js: throw new Error("[E2E_BLOCKED] Robot creation assigns a server-generated placeholder before a run-specific name can be saved. A failed create can leave an unidentifiable session. A disposable robot provisioning and exact-ID cleanup fixture is required before this mutating journey can run.");
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
teardown:
  - description: "No mutation occurred: validate the environment again instead of deleting arbitrary existing records"
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
