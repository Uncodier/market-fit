goal: Smoke test workspace navigation across Dashboard, Settings & Agents Area

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /dashboard
  - description: Require the loaded /dashboard read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/dashboard');

  - URL: /dashboard?tab=analytics
  - description: Require the loaded /dashboard?tab=analytics read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/dashboard?tab=analytics');

  - URL: /settings
