goal: Complete CRUD cycle for a Record

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /records

  - WAIT_UNTIL: The user is on the records list page
    js: "await page.url().endsWith('/records')"
    timeout_seconds: 15

  - intent: Click New Category button to ensure at least one category exists
    action: click
    locator: "getByRole('button', { name: /New Category|Nueva Categoría/i }).first()"

  - intent: Fill category name
    action: fill
    locator: "getByPlaceholder('e.g., Knowledge Base')"
    value: "Automated Record Category"

  - intent: Save category
    action: click
    locator: "getByRole('button', { name: /Save Template|Guardar/i })"

  - WAIT_UNTIL: Category modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - intent: Click New Record in the top bar to create an Untitled Record
    action: click
    locator: "getByRole('button', { name: /New Record|Nuevo|Nuevo/i }).first()"

  - WAIT_UNTIL: The record details route is open and loaded
    js: "await page.url().match(/\\/records\\/[^?]+$/) !== null && await page.locator('input[placeholder=\"Record Title\"]').count() > 0"
    timeout_seconds: 15

  - intent: Update the record title
    action: fill
    locator: "locator('input[placeholder=\"Record Title\"]')"
    value: "Automated Test Record"

  - intent: Save the record
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The save control is idle again
    js: "await page.getByRole('button', { name: 'Save' }).count() > 0"
    timeout_seconds: 10
