goal: Complete CRUD cycle for a Record
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - URL: /projects
  - description: Select the configured test project
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("recordName", `Shiplight Record ${runId}`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      const categoryName = process.env.TEST_RECORD_CATEGORY_NAME;
      if (!categoryName) throw new Error("TEST_RECORD_CATEGORY_NAME is required");
      testContext.set("recordCategoryName", categoryName);
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);

      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'record', [testContext.get('recordName')]);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/robots')), { timeout: 5000 }).toBe(true);"
    description: The user is navigated to the default project page
  - URL: /records
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/records')), { timeout: 15000 }).toBe(true);"
    description: The user is on the records list page
  - js: "await expect.poll(async () => Boolean((await page.getByRole('button', { name: testContext.get('recordCategoryName'), exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The configured record category is visible
  - description: Select the configured record category
    js: |
      const categoryName = testContext.get("recordCategoryName");
      await page.getByRole('button', { name: categoryName, exact: true }).click();
  - description: Register the automatic record-create attempt before clicking; do not guess cleanup if no ID returns
    js: require(process.cwd() + '/tests/support/mutation-fixtures').beginRecordCreation(testContext);
  - intent: Click New Record in the top bar to create the record in the selected category
    action: click
    locator: "getByRole('button', { name: 'New Record', exact: true })"
  - description: Remember the created record route for cleanup
    js: |-
      await expect(page).toHaveURL(/\/records\/[^/?]+$/);
      testContext.set('recordUrl', page.url());
      require(process.cwd() + '/tests/support/mutation-fixtures').rememberCreatedRecord(testContext, page.url());
  - js: "await expect.poll(async () => Boolean(await page.url().match(/\\/records\\/[^?]+$/) !== null && await page.locator('input[placeholder=\"Record Title\"]').count() > 0), { timeout: 15000 }).toBe(true);"
    description: The record details route is open and loaded
  - intent: Update the record title
    action: fill
    locator: locator('input[placeholder="Record Title"]')
    value: "{{recordName}}"
  - intent: Save the record
    action: click
    locator: "getByRole('button', { name: 'Save' })"
  - js: "await expect.poll(async () => Boolean(await page.getByText('Record saved').count() > 0), { timeout: 10000 }).toBe(true);"
    description: The record update succeeds
  - description: Reload the record details page to verify persistence
    js: await page.reload()
  - js: await expect(page.locator('input[placeholder="Record Title"]')).toHaveValue(testContext.get('recordName'))
    description: The edited record title persists after reload
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'record', testContext.get('recordName'));
  - intent: Click Delete record in the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete record' })"
  - intent: Confirm record deletion
    action: click
    locator: "getByRole('button', { name: 'Delete', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/records')), { timeout: 15000 }).toBe(true);"
    description: The user is back on the records list
  - description: Reload the records list before checking deletion
    js: await page.reload()
  - js: "await expect.poll(async () => Boolean((await page.getByPlaceholder('Search records...').count()) > 0 && (await page.locator('.animate-pulse:visible').count()) === 0), { timeout: 15000 }).toBe(true);"
    description: The records list has finished loading
  - js: "await expect(page.getByText(testContext.get('recordName'), { exact: true })).toHaveCount(0)"
    description: The deleted record is absent from the list
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'record');
teardown:
  - description: Cleanup the exact run-scoped fixture journal, including partial failures
    js: |-
      if (!testContext.get('recordUrl') && /\/records\/[0-9a-f-]{36}$/.test(new URL(page.url()).pathname)) {
        require(process.cwd() + '/tests/support/mutation-fixtures').rememberCreatedRecord(testContext, page.url());
      }
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/records');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
tags:
  - regression
  - mutation
