goal: Complete CRUD cycle for a Requirement

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /segments
  - intent: Click New Segment in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Segment' })"

  - intent: Fill the segment name
    action: fill
    locator: "locator('#name')"
    value: "Segment for Requirement"

  - intent: Fill the segment description
    action: fill
    locator: "locator('#description')"
    value: "Description"

  - intent: Open audience dropdown
    action: click
    locator: "getByRole('combobox').nth(0)"

  - WAIT_UNTIL: Dropdown animation finishes
    js: "await page.waitForTimeout(500)"
    timeout_seconds: 5

  - intent: Select audience type
    action: click
    locator: "getByRole('option', { name: 'Technology' })"

  - intent: Open language dropdown
    action: click
    locator: "getByRole('combobox').nth(1)"

  - WAIT_UNTIL: Dropdown animation finishes
    js: "await page.waitForTimeout(500)"
    timeout_seconds: 5

  - intent: Select language
    action: click
    locator: "getByRole('option', { name: 'English' })"

  - intent: Submit the create segment form
    action: click
    locator: "getByRole('button', { name: 'Create Segment' })"

  - WAIT_UNTIL: The create segment modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - URL: /requirements
  
  # Ensure a segment exists
  - intent: Click New Requirement in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Requirement' })"

  - intent: Fill the requirement title
    action: fill
    locator: "locator('input[name=\"title\"]')"
    value: "Automated Test Requirement"

  - intent: Fill the requirement description
    action: fill
    locator: "locator('textarea[name=\"description\"]')"
    value: "Automated Test Requirement Description"

  - intent: Select the first available segment
    action: click
    locator: "getByRole('switch').first()"

  - intent: Submit the create requirement form
    action: click
    locator: "getByRole('button', { name: 'Create requirement' })"

  - WAIT_UNTIL: The create requirement modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new requirement appears in the list
    js: "await page.getByText('Automated Test Requirement').count() > 0"
    timeout_seconds: 15

  - intent: Open the requirement details page
    action: click
    locator: "getByText('Automated Test Requirement').first()"

  - WAIT_UNTIL: The requirement details route is open
    js: "await page.url().includes('/requirements/') && !page.url().endsWith('/requirements')"
    timeout_seconds: 10

  - intent: Update the requirement title
    action: fill
    locator: "getByPlaceholder('Requirement title')"
    value: "Automated Test Requirement - Edited"

  - intent: Save the requirement
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The edited title is visible
    js: "await page.locator('input[value=\"Automated Test Requirement - Edited\"]').count() > 0"
    timeout_seconds: 10
