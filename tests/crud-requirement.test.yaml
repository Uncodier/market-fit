goal: Complete CRUD cycle for a Requirement

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /requirements
  - intent: Click New Requirement in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Requirement' })"

  - intent: Fill the requirement title
    action: fill
    locator: "locator('input[name=\"title\"]')"
    value: "Automated Test Requirement"

  - intent: Fill the requirement description
    action: fill
    locator: "locator('textarea[name=\"description\"]')"
    value: "Automated Test Requirement Description"

  - intent: Select the first available segment
    action: click
    locator: "locator('label[for^=\"segment-\"]').first()"

  - intent: Submit the create requirement form
    action: click
    locator: "getByRole('button', { name: 'Create requirement' })"

  - WAIT_UNTIL: The create requirement modal closes
    js: "page.getByRole('button', { name: 'Create requirement' }).count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new requirement appears in the list
    js: "page.getByText('Automated Test Requirement').count() > 0"
    timeout_seconds: 15

  - intent: Open the requirement details page
    action: click
    locator: "getByText('Automated Test Requirement').first()"

  - WAIT_UNTIL: The requirement details route is open
    js: "page.url().includes('/requirements/') && !page.url().endsWith('/requirements')"
    timeout_seconds: 10

  - intent: Update the requirement title
    action: fill
    locator: "getByPlaceholder('Requirement title')"
    value: "Automated Test Requirement - Edited"

  - intent: Save the requirement
    action: click
    locator: "getByRole('button', { name: 'Save' })"

  - WAIT_UNTIL: The edited title is visible
    js: "page.getByDisplayValue('Automated Test Requirement - Edited').count() > 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The user is on the requirements list page
    js: "page.url().endsWith('/requirements')"
    timeout_seconds: 15

  - intent: Open the delete confirmation
    action: click
    locator: "getByRole('button', { name: /Delete/i }).last()"

  - intent: Confirm Delete in the Delete Requirement dialog
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the requirements list
    js: "page.url().endsWith('/requirements')"
    timeout_seconds: 15

  - VERIFY: The edited requirement is gone from the list
    js: "await expect(page.getByText('Automated Test Requirement - Edited')).toHaveCount(0)"
