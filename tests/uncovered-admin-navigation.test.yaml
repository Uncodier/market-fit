goal: Smoke test previously uncovered authenticated workspace screens

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The workspace is selected
    js: "await page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /pos/check-in
  - VERIFY: Check-in loads
    js: "await expect(page.getByRole('heading', { name: 'Access Check-in' })).toBeVisible()"

  - URL: /purchases/subscriptions
  - VERIFY: Purchase subscriptions load without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /purchases/quotes
  - VERIFY: Purchase quotes load without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /purchases/library
  - VERIFY: Purchase library loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /context
  - VERIFY: Context loads
    js: "await expect(page.getByRole('tab', { name: 'Company' })).toBeVisible()"

  - URL: /skills
  - VERIFY: Skills load
    js: "await expect(page.getByRole('heading', { name: 'Code agent skills' })).toBeVisible()"

  - URL: /robots?mode=workflow
  - VERIFY: Workflows mode loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /robots?mode=imprenta
  - VERIFY: Content Creator mode loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /applications/repositories
  - VERIFY: Application repositories load
    js: "await expect(page.getByPlaceholder('Search repositories...')).toBeVisible()"

  - URL: /accounting
  - VERIFY: Chart of Accounts loads
    js: "await expect(page.getByRole('tab', { name: 'All' })).toBeVisible()"

  - URL: /payments
  - VERIFY: Payments loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /security
  - VERIFY: Security loads
    js: "await expect(page.getByRole('tab', { name: 'Authentication' })).toBeVisible()"

  - URL: /profile
  - VERIFY: Profile loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /notifications
  - VERIFY: Notifications load without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"

  - URL: /navigation
  - VERIFY: Application navigation loads without an error page
    js: "await expect(page).not.toHaveTitle(/500|Error/i)"
