goal: Complete CRUD cycle for a Modifier Group

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /catalog/modifier-groups
  - intent: Click New modifier group in the top bar
    action: click
    locator: "getByRole('button', { name: 'New modifier group' })"

  - intent: Fill the modifier group name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Modifier Group"

  - intent: Submit the create modifier group form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The modifier group details page is open
    js: "await page.url().includes('/catalog/modifier-groups/') && !page.url().endsWith('/catalog/modifier-groups')"
    timeout_seconds: 15

  - VERIFY: The created modifier group name is visible
    js: "await expect(page.getByText('Automated Test Modifier Group').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/catalog/modifier-groups')"
    timeout_seconds: 15

  - VERIFY: The modifier group is gone from the list
    js: "await expect(page.getByText('Automated Test Modifier Group')).toHaveCount(0)"
