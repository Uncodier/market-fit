goal: Validate manual check-in error handling

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The workspace is selected
    js: "await page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /pos/check-in
  - WAIT_UNTIL: Manual check-in is ready
    js: "await page.getByPlaceholder('Enter code...').count() > 0"
    timeout_seconds: 15

  - intent: Enter an invalid ticket code
    action: fill
    locator: "getByPlaceholder('Enter code...')"
    value: "SHIPLIGHT-INVALID-CHECK-IN"

  - intent: Submit the invalid ticket code
    action: click
    locator: "getByRole('button', { name: 'Submit' })"

  - VERIFY: An error notification is shown
    js: "await expect(page.locator('li[data-sonner-toast]')).toBeVisible()"

  - VERIFY: Manual entry remains available for retry
    js: "await expect(page.getByPlaceholder('Enter code...')).toBeVisible()"
