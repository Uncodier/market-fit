goal: Validate manual check-in error handling

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /pos/check-in
  - description: Require the loaded /pos/check-in read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/pos/check-in');

  - intent: Enter an invalid ticket code
    action: fill
    locator: "getByPlaceholder('Enter code...')"
    value: "SHIPLIGHT-INVALID-CHECK-IN"

  - description: Declare the exact expected validation error, without suppressing provider or server errors
    js: require(process.cwd() + '/tests/support/read-observation').expectActionError(page, '/pos/check-in', 'Invalid code');

  - intent: Submit the invalid ticket code
    action: click
    locator: "getByRole('button', { name: 'Submit' })"

  - description: The invalid code is rejected, not accepted or queued offline
    js: |
      await expect(page.locator('[data-sonner-toast][data-type="error"]').filter({ hasText: /^Invalid code$/ })).toBeVisible();
      await expect(page.locator('[data-sonner-toast][data-type="success"]')).toHaveCount(0);

  - description: Manual entry remains available for retry
    js: |
      await expect(page.getByPlaceholder('Enter code...')).toBeEnabled();
      await expect(page.getByPlaceholder('Enter code...')).toHaveValue('');

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
