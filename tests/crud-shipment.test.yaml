goal: Open and read the Shipment creation dialog without creating a shipment

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /shipments
  - description: Require the loaded /shipments read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/shipments');

  - intent: Open the shipment creation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Shipment' })"

  - description: The order selector is visible
    js: |
      await expect(page.getByRole('dialog', { name: 'Create Shipment', exact: true })).toBeVisible();
      await expect(page.getByRole('dialog').getByPlaceholder('Select an order...')).toBeVisible();

  - intent: Close the shipment creation dialog
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: /^Cancel$/i })"

  - description: The shipment creation dialog is closed
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await expect(page.getByRole('dialog')).toHaveCount(0);
      await assertReadRoute(page, '/shipments');

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
