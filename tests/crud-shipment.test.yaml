goal: Complete CRUD cycle for a Shipment

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /shipments
  - intent: Click New shipment in the top bar
    action: click
    locator: "getByRole('button', { name: 'New shipment' })"

  - intent: Fill the shipment name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Shipment"

  - intent: Submit the create shipment form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The shipment details page is open
    js: "await page.url().includes('/shipments/') && !page.url().endsWith('/shipments')"
    timeout_seconds: 15

  - VERIFY: The created shipment name is visible
    js: "await expect(page.getByText('Automated Test Shipment').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/shipments')"
    timeout_seconds: 15

  - VERIFY: The shipment is gone from the list
    js: "await expect(page.getByText('Automated Test Shipment')).toHaveCount(0)"
