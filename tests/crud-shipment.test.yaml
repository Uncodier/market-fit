goal: Open and validate the Shipment creation flow

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /shipments
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/shipments')"
    timeout_seconds: 15

  - intent: Open the shipment creation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Shipment' })"

  - VERIFY: The order selector is visible
    js: "await expect(page.getByPlaceholder('Select an order...')).toBeVisible()"

  - intent: Close the shipment creation dialog
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: /^Cancel$/i })"

  - VERIFY: The shipment creation dialog is closed
    js: "await expect(page.getByRole('dialog')).toHaveCount(0)"
