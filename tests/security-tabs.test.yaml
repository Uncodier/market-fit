goal: Read every Security settings section

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /security
  - description: Require the loaded /security read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/security');

  - description: Authentication is selected by default
    js: "await expect(page.getByRole('tab', { name: 'Authentication' })).toHaveAttribute('data-state', 'active')"

  - intent: Open API Keys
    action: click
    locator: "getByRole('tab', { name: 'API Keys' })"
  - description: API Keys is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'API Keys', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/security', page.getByRole('heading', { name: 'API Keys', exact: true }));

  - intent: Open Robot Sessions
    action: click
    locator: "getByRole('tab', { name: 'Robot Sessions' })"
  - description: Robot Sessions content is visible
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Robot Sessions', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/security', page.getByRole('heading', { name: 'Robot Sessions', exact: true }));

  - intent: Open Allowed Domains
    action: click
    locator: "getByRole('tab', { name: 'Allowed Domains' })"
  - description: Allowed Domains is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Allowed Domains', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/security', page.getByRole('heading', { name: 'Allowed Domains', exact: true }));

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
