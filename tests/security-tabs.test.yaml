goal: Read every Security settings section

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The workspace is selected
    js: "await page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /security
  - WAIT_UNTIL: Security settings are ready
    js: "await page.getByRole('tab', { name: 'Authentication' }).count() > 0"
    timeout_seconds: 15

  - VERIFY: Authentication is selected by default
    js: "await expect(page.getByRole('tab', { name: 'Authentication' })).toHaveAttribute('data-state', 'active')"

  - intent: Open API Keys
    action: click
    locator: "getByRole('tab', { name: 'API Keys' })"
  - VERIFY: API Keys is selected
    js: "await expect(page.getByRole('tab', { name: 'API Keys' })).toHaveAttribute('data-state', 'active')"

  - intent: Open Robot Sessions
    action: click
    locator: "getByRole('tab', { name: 'Robot Sessions' })"
  - VERIFY: Robot Sessions content is visible
    js: "await expect(page.getByRole('heading', { name: 'Robot Sessions' })).toBeVisible()"

  - intent: Open Allowed Domains
    action: click
    locator: "getByRole('tab', { name: 'Allowed Domains' })"
  - VERIFY: Allowed Domains is selected
    js: "await expect(page.getByRole('tab', { name: 'Allowed Domains' })).toHaveAttribute('data-state', 'active')"
