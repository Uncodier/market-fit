goal: Read, update, and restore the explicitly selected marketplace setting
tags:
  - regression
  - mutation
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID on a disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Capture the original marketplace value before editing, save, and assert persistence after reload
    js: await require(process.cwd() + '/tests/support/mutation-settings').updateField(page, testContext, 'marketplace');
teardown:
  - description: Restore only the captured original in teardown even after failure; assert restoration after reload
    js: await require(process.cwd() + '/tests/support/mutation-settings').restoreField(page, testContext);
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
