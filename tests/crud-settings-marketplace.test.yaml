goal: Update and restore Marketplace settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Marketplace tab
    action: click
    locator: "getByRole('tab', { name: /Marketplace/i })"

  - description: Preserve and update the marketplace hero title
    js: |
      const field = page.getByPlaceholder('Premium quality. Exceptional design.');
      const original = await field.inputValue();
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:marketplace', value), original);
      await field.fill(`${original} [Shiplight E2E]`);

  - intent: Save the updated Marketplace settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"

  - WAIT_UNTIL: The Marketplace settings save completes
    js: "await page.waitForTimeout(1000)"
    timeout_seconds: 5

  - intent: Return to the Marketplace tab after settings refresh
    action: click
    locator: "getByRole('tab', { name: /Marketplace/i })"

  - description: Restore the original marketplace hero title
    js: |
      const field = page.getByPlaceholder('Premium quality. Exceptional design.');
      const original = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:marketplace') || '');
      await field.fill(original);

  - intent: Save the restored Marketplace settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"
