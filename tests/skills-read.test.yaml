goal: Read and expand Code Agent skills

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /skills?tab=makinari-skills
  - description: Require the loaded /skills?tab=makinari-skills read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/skills?tab=makinari-skills');

  - description: Frontend Blog and SEO skill is listed
    js: "await expect(page.getByText('Frontend Blog & SEO', { exact: true }).first()).toBeVisible()"

  - description: Expand the Frontend Blog and SEO skill
    js: "await page.locator('#skill-frontend-blog-seo button').first().click()"

  - description: The expanded skill exposes its instructions
    js: "await expect(page.locator('#skill-frontend-blog-seo pre')).toBeVisible()"

  - description: Copy Skill remains available
    js: "await expect(page.locator('#skill-frontend-blog-seo').getByRole('button', { name: 'Copy Skill' })).toBeVisible()"

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
