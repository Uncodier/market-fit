goal: Complete CRUD cycle for a Quotation

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /quotations
  - intent: Click Create Quotation in the top bar
    action: click
    locator: "getByRole('button', { name: 'Create Quotation' })"

  - intent: Fill the quotation name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Quotation"

  - intent: Type a new client name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Select or create client...')"
    value: "Automated Quote Client"

  - intent: Create the client on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Quote Client\"')"

  - intent: Fill the client email required for a new client
    action: fill
    locator: "locator('#clientEmail')"
    value: "shiplight.quote.client@example.com"

  - intent: Type a new catalog item in the line-item dependency selector
    action: fill
    locator: "getByPlaceholder('Select or create an item...')"
    value: "Automated Quote Item"

  - intent: Create the catalog item on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Quote Item\"')"

  - intent: Submit the create quotation form
    action: click
    locator: "getByRole('button', { name: 'Create Quotation' }).last()"

  - WAIT_UNTIL: The create quotation modal closes
    js: "page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The quotation details page is open
    js: "page.url().includes('/quotations/') && !page.url().endsWith('/quotations')"
    timeout_seconds: 15

  - VERIFY: The quotation page loaded
    js: "await expect(page.getByRole('button', { name: 'Delete' })).toBeVisible()"

  - intent: Click Delete on the quotation toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion of the quotation
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the quotations list
    js: "page.url().endsWith('/quotations')"
    timeout_seconds: 15
