goal: Complete CRUD cycle for a Asset

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /assets
  - intent: Click New asset in the top bar
    action: click
    locator: "getByRole('button', { name: 'New asset' })"

  - intent: Fill the asset name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Asset"

  - intent: Submit the create asset form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The asset details page is open
    js: "await page.url().includes('/assets/') && !page.url().endsWith('/assets')"
    timeout_seconds: 15

  - VERIFY: The created asset name is visible
    js: "await expect(page.getByText('Automated Test Asset').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/assets')"
    timeout_seconds: 15

  - VERIFY: The asset is gone from the list
    js: "await expect(page.getByText('Automated Test Asset')).toHaveCount(0)"
