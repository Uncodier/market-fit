goal: Complete create, read, and delete cycle for an Asset

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /assets
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/assets')"
    timeout_seconds: 15

  - intent: Click New asset in the top bar
    action: click
    locator: "getByRole('button', { name: 'New asset' })"

  - intent: Fill the asset name
    action: fill
    locator: "getByLabel('Name')"
    value: "Automated Test Asset"

  - intent: Upload the asset fixture
    action: upload_file
    locator: "getByText('Drag and drop a file or click to select')"
    paths: "fixtures/e2e-asset.svg"

  - intent: Submit the asset upload form
    action: click
    locator: "getByRole('button', { name: 'Upload Asset' })"

  - VERIFY: The created asset name is visible
    js: "await expect(page.getByText('Automated Test Asset').first()).toBeVisible()"

  - intent: Delete the uploaded test asset
    action: click
    locator: "getByRole('button', { name: 'Delete Automated Test Asset' }).first()"

  - intent: Confirm deletion of the uploaded test asset
    action: click
    locator: "getByRole('button', { name: 'Delete Asset' })"

  - VERIFY: The asset is gone from the list
    js: "await expect(page.getByText('Automated Test Asset')).toHaveCount(0)"
