goal: Verify mobile browser quality on stable read-only routes

statements:
  - description: Require a mobile viewport and navigate the explicit commerce host
    js: |
      const { commerceFixtures, commerceUrl, assertReadReady, catalogItemLink } = require(process.cwd() + '/tests/support/read-assertions');
      const { startReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      expect(page.viewportSize()?.width).toBeLessThan(768);
      const { itemId, itemName } = commerceFixtures();
      startReadObservation(page);
      const response = await page.goto(commerceUrl('/marketplace'), { waitUntil: 'domcontentloaded' });
      expect(response?.ok()).toBe(true);
      await dismissConsent(page);
      await assertReadReady(page, commerceUrl('/marketplace'), catalogItemLink(page, `/marketplace/${itemId}`, itemName));

  - description: Marketplace header is visible
    js: await expect(page.getByRole('banner').first()).toBeVisible()

  - description: Marketplace has exactly one main landmark
    js: await expect(page.getByRole('main')).toHaveCount(1)

  - description: Marketplace main content is visible
    js: await expect(page.getByRole('main')).toBeVisible()

  - description: Marketplace footer is visible
    js: await expect(page.getByRole('contentinfo').first()).toBeVisible()

  - description: Marketplace does not overflow the mobile viewport
    js: |
      await expect.poll(async () => page.evaluate(
        () => document.documentElement.scrollWidth <= document.documentElement.clientWidth
      )).toBe(true);

  - description: Check marketplace accessibility
    js: |
      const { default: AxeBuilder } = await import('@axe-core/playwright');
      const results = await new AxeBuilder({ page })
        .exclude('nextjs-portal')
        .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'])
        .analyze();
      expect(results.violations, JSON.stringify(results.violations, null, 2)).toEqual([]);

  - description: Reach marketplace search using only the keyboard
    js: |
      const search = page.getByRole('button', { name: 'Search', exact: true });
      await expect(search).toBeVisible();
      for (let index = 0; index < 10 && !(await search.evaluate((element) => element === document.activeElement)); index += 1) {
        await page.keyboard.press('Tab');
      }
      await expect(search).toBeFocused();
      await page.keyboard.press('Enter');

  - description: Keyboard activation opens mobile search
    js: await expect(page.locator('#mobile-search-input')).toBeVisible()

  - description: Keyboard activation moves focus into mobile search
    js: await expect(page.locator('#mobile-search-input')).toBeFocused()

  - description: Close mobile search with the keyboard
    js: |
      await page.keyboard.press('Escape');

  - description: Mobile search closes
    js: await expect(page.locator('#mobile-search-input')).toBeHidden()

  - description: Mobile search restores opener focus
    js: "await expect(page.getByRole('button', { name: 'Search', exact: true })).toBeFocused()"

  - description: Navigate to the workspace project chooser on TEST_BASE_URL
    js: |
      const { requiredReadFixture, assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      const target = new URL('/projects?manage=1', requiredReadFixture('TEST_BASE_URL')).href;
      await page.goto(target, { waitUntil: 'domcontentloaded' });
      await dismissConsent(page);
      const siteName = requiredReadFixture('TEST_SITE_NAME');
      await assertReadReady(page, target, page.getByRole('button', { name: `Select ${siteName}`, exact: true }));

  - description: The project chooser receives exactly one main landmark
    js: await expect(page.getByRole('main')).toHaveCount(1)

  - description: The project chooser main landmark is visible
    js: await expect(page.getByRole('main')).toBeVisible()

  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /content
  - description: Require the mobile content search control before opening its dialog
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      const { dismissConsent } = require(process.cwd() + '/tests/support/workspace');
      await assertReadReady(page, '/content', page.getByRole('button', { name: 'Search', exact: true }).first());
      await dismissConsent(page);

  - description: Open the mobile search and filters dialog
    js: |
      const trigger = page.getByRole('button', { name: 'Search', exact: true }).first();
      await trigger.click();

  - description: The mobile search dialog opens
    js: "await expect(page.getByRole('dialog', { name: 'Search' })).toBeVisible()"

  - description: The mobile search dialog receives focus
    js: "await expect(page.getByRole('dialog', { name: 'Search' }).locator(':focus')).toHaveCount(1)"

  - description: Check mobile search dialog accessibility
    js: |
      const { default: AxeBuilder } = await import('@axe-core/playwright');
      const results = await new AxeBuilder({ page })
        .include('[role="dialog"]')
        .exclude('nextjs-portal')
        .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'])
        .analyze();
      expect(results.violations, JSON.stringify(results.violations, null, 2)).toEqual([]);

  - description: Close the mobile dialog with the keyboard
    js: |
      await page.keyboard.press('Escape');

  - description: The mobile search dialog closes
    js: "await expect(page.getByRole('dialog', { name: 'Search' })).toBeHidden()"

  - description: The mobile search dialog restores trigger focus
    js: "await expect(page.getByRole('button', { name: 'Search', exact: true }).first()).toBeFocused()"

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
