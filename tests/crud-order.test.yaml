goal: Open and validate the Order creation flow

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /orders
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/orders')"
    timeout_seconds: 15

  - intent: Open the Order creation flow
    action: click
    locator: "getByRole('button', { name: 'Create Order' })"

  - VERIFY: The order name field is visible
    js: "await expect(page.getByPlaceholder('New Order')).toBeVisible()"

  - VERIFY: The Send Order action is visible
    js: "await expect(page.getByRole('button', { name: 'Send Order' })).toBeVisible()"

  - URL: /orders
