goal: Open and read the Order creation form without creating an order

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /orders
  - description: Require the loaded /orders read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/orders');

  - intent: Open the Order creation flow
    action: click
    locator: "getByRole('button', { name: 'Create Order' })"

  - description: The order name field is visible
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/pos');
      await expect(page.getByPlaceholder('New Order')).toBeVisible();

  - description: The Send Order action is visible
    js: "await expect(page.getByRole('button', { name: 'Send Order' })).toBeVisible()"

  - URL: /orders
  - description: The order list is ready again after leaving the unsaved form
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/orders');

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
