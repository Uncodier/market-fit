goal: Complete CRUD cycle for a Order

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /orders
  - intent: Click New order in the top bar
    action: click
    locator: "getByRole('button', { name: 'New order' })"

  - intent: Fill the order name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Order"

  - intent: Submit the create order form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The order details page is open
    js: "await page.url().includes('/orders/') && !page.url().endsWith('/orders')"
    timeout_seconds: 15

  - VERIFY: The created order name is visible
    js: "await expect(page.getByText('Automated Test Order').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/orders')"
    timeout_seconds: 15

  - VERIFY: The order is gone from the list
    js: "await expect(page.getByText('Automated Test Order')).toHaveCount(0)"
