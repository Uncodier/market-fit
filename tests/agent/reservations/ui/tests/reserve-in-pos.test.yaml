# Draft spec for reserving in POS
goal: Add the reservable item to POS cart and checkout
base_url: "http://localhost:3000"

statements:
  - URL: /pos
  
  - WAIT_UNTIL: POS page loaded
    js: "await page.locator('text=Reservable Item Agent').count() > 0"
    timeout_seconds: 15

  - intent: Select the reservable item
    action: click
    locator: "getByRole('heading', { name: 'Reservable Item Agent' })"

  - WAIT_UNTIL: Reservation dialog opens
    js: "await page.getByRole('dialog').count() > 0"
    timeout_seconds: 5

  - intent: Select customer
    action: click
    locator: "getByRole('combobox').first()"

  - intent: Click create new customer option
    action: fill
    locator: "getByPlaceholder(/Search by name|Buscar/i)"
    value: "POS Reservator"

  - intent: Click create option
    action: click
    locator: "getByText(/Create \"POS Reservator\"|Crear \"POS Reservator\"/i)"

  - WAIT_UNTIL: Customer details dialog opens
    js: "await page.getByText(/New Lead|Nuevo/).count() > 0"

  - intent: Fill customer email
    action: fill
    locator: "getByLabel(/Email|Correo/i)"
    value: "pos-reservator@marketfit.test"

  - intent: Save new customer
    action: click
    locator: "getByRole('button', { name: /Save|Guardar/i })"

  - WAIT_UNTIL: Wait for details dialog to close
    js: "await page.getByText(/New Lead|Nuevo/).count() === 0"
    timeout_seconds: 5

  - description: Select an available date
    js: |
      const btn = await page.locator('button:not([disabled])').filter({ hasText: /^([1-9]|[12][0-9]|3[01])$/ }).first();
      await btn.click();

  - WAIT_UNTIL: Wait for time slots to load
    js: "await page.locator('button:has-text(\":\")').count() > 0"
    timeout_seconds: 5

  - intent: Select first time slot
    action: click
    locator: "locator('button:has-text(\":\")').first()"

  - intent: Confirm reservation
    action: click
    locator: "getByRole('button', { name: /Confirm|Confirmar/i })"
    
  - WAIT_UNTIL: Wait for dialog to close
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 5

  - intent: Click Checkout
    action: click
    locator: "getByRole('button', { name: /Checkout|Cobrar/i })"
    
  - WAIT_UNTIL: Checkout page loads
    js: "await page.url().includes('/checkout')"
    timeout_seconds: 10
