# Draft spec for reserving in POS
goal: Add the reservable item to POS cart and checkout

statements:
  - URL: /pos
  
  - WAIT_UNTIL: POS page loaded
    js: "await page.locator('text=Reservable Item Agent').count() > 0"
    timeout_seconds: 15

  - intent: Select the reservable item
    action: click
    locator: "getByRole('heading', { name: 'Reservable Item Agent' })"

  - WAIT_UNTIL: Reservation dialog opens
    js: "await page.getByRole('dialog').count() > 0"
    timeout_seconds: 5

  - intent: Select customer
    action: click
    locator: "getByPlaceholder('Select a customer')"

  - intent: Type new customer name
    action: fill
    locator: "getByPlaceholder('Select a customer')"
    value: "POS Reservator"

  - WAIT_UNTIL: Wait for create option to appear
    js: "await page.locator('.cursor-pointer.font-inter').filter({ hasText: /Use \"POS Reservator\"|POS Reservator/i }).count() > 0"
    timeout_seconds: 10

  - intent: Click create new customer option
    action: click
    locator: "locator('.cursor-pointer.font-inter').filter({ hasText: /Use \"POS Reservator\"|POS Reservator/i }).first()"

  - WAIT_UNTIL: Customer details dialog opens
    js: "await page.getByRole('dialog').count() > 0"
    timeout_seconds: 5

  - description: Fill customer email with unique value
    js: "await page.locator('input[type=\"email\"]').first().fill(`pos-reservator-${Date.now()}@marketfit.test`)"

  - intent: Save new customer
    action: click
    locator: "getByRole('button', { name: /Save|Guardar/i })"

  - WAIT_UNTIL: Wait for details dialog to close
    js: "await page.getByRole('dialog').count() === 0 && await page.locator('.fixed.inset-0.bg-black\\\\/40').count() === 0"
    timeout_seconds: 15

  - description: Select an available date
    js: |
      await page.waitForTimeout(1000);
      let btn = page.locator('button.h-10.w-10.rounded-full:not([disabled])').filter({ hasText: /^([1-9]|[12][0-9]|3[01])$/ }).first();
      for (let i = 0; i < 3; i++) {
        try {
          await btn.waitFor({ state: 'visible', timeout: 5000 });
          break;
        } catch (e) {
          let nextBtn = page.locator('button:has(svg polyline[points="9 18 15 12 9 6"])').first();
          if (await nextBtn.count() > 0 && await nextBtn.isVisible()) {
             await nextBtn.click();
             await page.waitForTimeout(1000);
          }
        }
      }
      await btn.click({ timeout: 5000, force: true });

  - description: Wait for time slots to load
    js: "await page.waitForTimeout(2000)"

  - intent: Select first time slot
    action: click
    locator: "locator('button:has-text(\":\")').first()"

  - intent: Confirm reservation
    action: click
    locator: "getByRole('button', { name: /Confirm|Confirmar/i })"
    
  - WAIT_UNTIL: Wait for details dialog to close
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 5

  - intent: Click Checkout
    action: click
    locator: "getByRole('button', { name: /Checkout|Charge|Cobrar/i })"
    
  - WAIT_UNTIL: Checkout page loads
    js: "await page.url().includes('/checkout')"
    timeout_seconds: 10
