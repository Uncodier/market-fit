goal: Create a reservable item in the catalog
statements:
  - description: Require isolated agent context and exact selected workspace
    js: |-
      if (!process.env.TEST_PROJECT_ROOT) throw new Error('TEST_PROJECT_ROOT is required');
      const f = require(process.env.TEST_PROJECT_ROOT + '/tests/agent/reservations/fixture');
      testContext.set('agentItemName', f.itemName());
      await require(process.env.TEST_PROJECT_ROOT + '/tests/support/workspace').selectWorkspace(page);
  - URL: /catalog
  - intent: Open create item dialog
    action: click
    locator: "getByRole('button', { name: /Agregar ítem|Add Item/i }).first()"
  - intent: Fill item name
    action: fill
    locator: locator('#name')
    value: "{{agentItemName}}"
  - intent: Toggle is_reservation
    action: click
    locator: locator('#is_reservation')
  - intent: Click create
    action: click
    locator: "getByRole('button', { name: /Crear ítem|Create item/i }).first()"
  - WAIT_UNTIL: Wait for dialog to close
    js: await page.locator('dialog').count() === 0
    timeout_seconds: 10
  - description: Save item id to evidence
    js: |-
      await expect(page.getByRole('dialog')).toHaveCount(0);
      const name = testContext.get('agentItemName');
      const row = page.locator('tr').filter({ hasText: name });
      await expect(row).toHaveCount(1);
      const href = await row.locator('a[href*="/catalog/"]').first().getAttribute('href');
      if (!href) throw new Error('Created catalog item link missing');
      const id = new URL(href, page.url()).pathname.split('/').pop();
      require(process.env.TEST_PROJECT_ROOT + '/tests/agent/reservations/fixture').saveItem(id);
