# Draft spec for reserving manually from Reservations page
goal: Create a reservation manually from the back office

statements:
  - URL: "/reservations"
  
  - WAIT_UNTIL: Reservations page loads
    js: "await page.locator('button:has-text(\"Create Reservation\")').count() > 0"
    timeout_seconds: 15

  - intent: Open new reservation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Reservation' }).first()"

  - WAIT_UNTIL: Reservation dialog opens
    js: "await page.getByRole('dialog').count() > 0"
    timeout_seconds: 5

  - intent: Open service select dropdown
    action: click
    locator: "getByPlaceholder(/Select a reservable service/i)"

  - intent: Select the Reservable Item
    action: fill
    locator: "getByPlaceholder(/Select a reservable service/i)"
    value: "Reservable Item Agent"
    
  - WAIT_UNTIL: Wait for Reservable Item Agent option
    js: "await page.getByText('Reservable Item Agent').count() > 0"
    timeout_seconds: 5

  - intent: Click item
    action: click
    locator: "getByText('Reservable Item Agent').first()"

  - intent: Open customer dropdown
    action: click
    locator: "getByPlaceholder(/Select customer/i)"

  - intent: Search for customer
    action: fill
    locator: "getByPlaceholder(/Select customer/i)"
    value: "Admin"

  - WAIT_UNTIL: Wait for Admin customer option
    js: "await page.getByText(/Timothy Meehan|Admin/i).count() > 0"
    timeout_seconds: 5

  - intent: Select customer
    action: click
    locator: "getByText(/Timothy Meehan|Admin/i).first()"

  - description: Select an available date
    js: |
      let btn = page.locator('button').filter({ hasText: /^([1-9]|[12][0-9]|3[01])$/ }).filter({ hasNot: page.locator('[disabled]') }).first();
      await btn.click({ timeout: 5000 });
      
  - description: Wait for time slots to load
    js: "await page.waitForTimeout(2000)"

  - intent: Select first time slot
    action: click
    locator: "locator('button:has-text(\":\")').first()"

  - intent: Create reservation
    action: click
    locator: "getByRole('button', { name: /Create|Crear/i }).last()"
    
  - WAIT_UNTIL: Wait for dialog to close
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10
