# Draft spec for reserving manually from Reservations page
goal: Create a reservation manually from the back office

statements:
  - URL: "/reservations"
  
  - WAIT_UNTIL: Reservations page loads
    js: "await page.locator('button:has-text(\"Create Reservation\")').count() > 0"
    timeout_seconds: 15

  - intent: Open new reservation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Reservation' }).first()"

  - WAIT_UNTIL: Reservation dialog opens
    js: "await page.getByRole('dialog').count() > 0"
    timeout_seconds: 5

  - intent: Open service select dropdown
    action: click
    locator: "getByPlaceholder(/Select a reservable service/i)"

  - intent: Select the Reservable Item
    action: fill
    locator: "getByPlaceholder(/Select a reservable service/i)"
    value: "Reservable Item Agent"
    
  - WAIT_UNTIL: Wait for Reservable Item Agent option
    js: "await page.locator('.cursor-pointer.font-inter').filter({ hasText: 'Reservable Item Agent' }).count() > 0"
    timeout_seconds: 5

  - intent: Click item
    action: click
    locator: "locator('.cursor-pointer.font-inter').filter({ hasText: 'Reservable Item Agent' }).first()"

  - intent: Open customer dropdown
    action: click
    locator: "getByPlaceholder(/Select customer/i)"

  - intent: Search for customer
    action: fill
    locator: "getByPlaceholder(/Select customer/i)"
    value: "Admin"

  - WAIT_UNTIL: Wait for Admin customer option
    js: "await page.locator('.cursor-pointer.font-inter').filter({ hasText: /Timothy Meehan|Admin/i }).count() > 0"
    timeout_seconds: 5

  - intent: Select customer
    action: click
    locator: "locator('.cursor-pointer.font-inter').filter({ hasText: /Timothy Meehan|Admin/i }).first()"

  - description: Select an available date
    js: |
      await page.waitForTimeout(1000);
      let btn = page.locator('button.h-10.w-10.rounded-full:not([disabled])').filter({ hasText: /^([1-9]|[12][0-9]|3[01])$/ }).first();
      for (let i = 0; i < 3; i++) {
        try {
          await btn.waitFor({ state: 'visible', timeout: 5000 });
          break;
        } catch (e) {
          let nextBtn = page.locator('button:has(svg polyline[points="9 18 15 12 9 6"])').first();
          if (await nextBtn.count() > 0 && await nextBtn.isVisible()) {
             await nextBtn.click();
             await page.waitForTimeout(1000);
          }
        }
      }
      await btn.click({ timeout: 5000, force: true });
      
  - description: Wait for time slots to load
    js: "await page.waitForTimeout(2000)"

  - intent: Select first time slot
    action: click
    locator: "locator('button:has-text(\":\")').first()"

  - intent: Create reservation
    action: click
    locator: "getByRole('button', { name: /Create|Crear/i }).last()"
    
  - WAIT_UNTIL: Wait for dialog to close
    js: "await page.getByRole('dialog').count() === 0 && await page.locator('.fixed.inset-0.bg-black\\\\/40').count() === 0"
    timeout_seconds: 15
