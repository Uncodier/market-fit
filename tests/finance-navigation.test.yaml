goal: Smoke test workspace navigation across Buying & Finance Area

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /bills
  - description: Require the loaded /bills read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/bills');

  - URL: /transactions
  - description: Require the loaded /transactions read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/transactions');

  - URL: /purchases/orders
