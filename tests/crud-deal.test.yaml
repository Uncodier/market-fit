goal: Create, read, and update a Deal (no delete control in the UI)

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /deals
  - intent: Click Create Deal in the top bar
    action: click
    locator: "getByRole('button', { name: 'Create Deal' })"

  - intent: Fill the deal name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Deal"

  - intent: Fill the deal amount
    action: fill
    locator: "locator('#amount')"
    value: "1000"

  - intent: Type a new company name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Search company...')"
    value: "Automated Deal Company"

  - intent: Create the company on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Deal Company\"')"

  - intent: Type a new lead name in the dependency selector
    action: fill
    locator: "getByPlaceholder('Search lead...')"
    value: "Automated Deal Contact"

  - intent: Create the lead on the fly with Use
    action: click
    locator: "getByText('Use \"Automated Deal Contact\"')"

  - intent: Submit the create deal form
    action: click
    locator: "getByRole('button', { name: 'Create deal' })"

  - WAIT_UNTIL: The new deal appears in the list
    js: "page.getByText('Automated Test Deal').count() > 0"
    timeout_seconds: 15

  - intent: Open the deal details page
    action: click
    locator: "getByText('Automated Test Deal').first()"

  - WAIT_UNTIL: The deal details route is open
    js: "page.url().includes('/deals/') && !page.url().endsWith('/deals')"
    timeout_seconds: 10

  - VERIFY: The details heading shows the created deal name
    js: "expect(page.getByRole('heading', { name: 'Automated Test Deal' })).toBeVisible()"

  - intent: Click the deal name heading to start inline edit
    action: click
    locator: "getByRole('heading', { name: 'Automated Test Deal' })"

  - intent: Replace the deal name with the edited value
    action: fill
    locator: "locator('input.h-8')"
    value: "Automated Test Deal - Edited"

  - intent: Save the inline name edit
    action: press
    keys: Enter

  - WAIT_UNTIL: The heading shows the edited name
    js: "page.getByRole('heading', { name: 'Automated Test Deal - Edited' }).count() > 0"
    timeout_seconds: 10

  - VERIFY: The edited deal name is visible
    js: "expect(page.getByRole('heading', { name: 'Automated Test Deal - Edited' })).toBeVisible()"
