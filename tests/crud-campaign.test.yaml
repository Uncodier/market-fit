goal: Create, read, and update a Campaign (no delete control wired in the UI)

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /campaigns
  
  - WAIT_UNTIL: The user is on the campaigns list page
    js: "await page.url().endsWith('/campaigns')"
    timeout_seconds: 10

  - intent: Click New Campaign in the top bar
    action: click
    locator: "getByRole('button', { name: /New Campaign|Nueva/i }).first()"

  - intent: Fill the required campaign title
    action: fill
    locator: "locator('#title')"
    value: "Automated Test Campaign"

  - intent: Submit the create campaign form
    action: click
    locator: "getByRole('button', { name: 'Create campaign' })"

  - WAIT_UNTIL: The create campaign modal closes
    js: "await page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The campaign details page is open
    js: "await page.url().includes('/campaigns/') && !page.url().endsWith('/campaigns')"
    timeout_seconds: 15

  - VERIFY: The details heading shows the created campaign title
    js: "await expect(page.getByRole('heading', { name: 'Automated Test Campaign' }).first()).toBeVisible()"

  - intent: Click the campaign title heading to start inline edit
    action: click
    locator: "getByRole('heading', { name: 'Automated Test Campaign' }).nth(1)"

  - intent: Replace the campaign title with the edited value
    action: fill
    locator: "locator('input.h-8')"
    value: "Automated Test Campaign - Edited"

  - intent: Save the inline title edit
    action: press
    keys: Enter

  - WAIT_UNTIL: The heading shows the edited title
    js: "await page.getByRole('heading', { name: 'Automated Test Campaign - Edited' }).count() > 0"
    timeout_seconds: 10

  - VERIFY: The edited campaign title is visible
    js: "await expect(page.getByRole('heading', { name: 'Automated Test Campaign - Edited' }).first()).toBeVisible()"
