goal: Read accounting and payment views without changing financial data

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - description: Navigate to accounting without waiting for long-lived resources
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await page.goto('/accounting', { waitUntil: 'domcontentloaded', timeout: 60000 });
      await assertReadRoute(page, '/accounting');
  - intent: Filter asset accounts
    action: click
    locator: "getByRole('tab', { name: 'Asset', exact: true })"
  - description: Asset accounts filter is active
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Asset', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/accounting', page.getByRole('table').or(page.getByText('No accounts found matching this filter.', { exact: true })).first());

  - intent: Open Opening Balances
    action: click
    locator: "getByRole('button', { name: 'Opening Balances' })"
  - description: Opening Balances dialog is visible
    js: "await expect(page.getByRole('dialog').getByText('Opening Balances', { exact: true })).toBeVisible()"
  - intent: Close Opening Balances without changes
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: 'Cancel' })"
  - description: Opening Balances closes without saving
    js: "await expect(page.getByRole('dialog')).toHaveCount(0)"

  - URL: /payments
  - description: Require the loaded /payments read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/payments');

  - description: Payment summary is visible
    js: "await expect(page.getByText('Total Usable Credits')).toBeVisible()"

  - intent: Open payment operations
    action: click
    locator: "getByRole('tab', { name: 'Operations' })"
  - description: Operations view is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Operations' })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/payments', page.getByRole('tabpanel').getByRole('heading', { name: 'Operations', exact: true }));

  - intent: Open withdrawals
    action: click
    locator: "getByRole('tab', { name: 'Withdrawals' })"
  - description: Withdrawals view is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Withdrawals' })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/payments', page.getByRole('tabpanel').getByRole('heading', { name: 'Withdrawals', exact: true }));

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
