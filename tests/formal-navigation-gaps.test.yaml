goal: Cover formal application routes missing from the navigation suite

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /sales-home
  - description: Sales Home quick actions are visible on the correct route
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await assertReadReady(page, '/sales-home', page.getByRole('heading', { name: 'Quick Navigation', exact: true }));
      await expect(page.getByRole('button', { name: 'Create Sale' })).toBeVisible();

  - URL: /settings?tab=activities
  - description: AI activity content and controls are loaded without changing settings
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await assertReadReady(page, '/settings?tab=activities', page.locator('#activities'));
      await expect(page.getByRole('heading', { name: 'Daily Resume and Stand Up' })).toBeVisible();

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
