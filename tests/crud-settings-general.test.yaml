goal: Update and restore General settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click General tab
    action: click
    locator: "getByRole('tab', { name: /General/i })"

  - description: Preserve and update the site description
    js: |
      const field = page.getByPlaceholder('Describe your site...');
      const original = await field.inputValue();
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:general', value), original);
      await field.fill(`${original} [Shiplight E2E]`);

  - intent: Save the updated General settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"

  - WAIT_UNTIL: The General settings save completes
    js: "await page.waitForTimeout(1000)"
    timeout_seconds: 5

  - intent: Return to the General tab after settings refresh
    action: click
    locator: "getByRole('tab', { name: /General/i })"

  - description: Restore the original site description
    js: |
      const field = page.getByPlaceholder('Describe your site...');
      const original = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:general') || '');
      await field.fill(original);

  - intent: Save the restored General settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"
