goal: Complete CRUD cycle for a Control Center task
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - description: Register run-owned fixture names before any creation
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('taskEditedName', `Shiplight Task ${runId} Edited`);
      testContext.set('taskName', `Shiplight Task ${runId}`);
      testContext.set('taskLeadName', `Shiplight Task Lead ${runId}`);
      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'lead', [testContext.get('taskLeadName')]);
      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'task', [testContext.get('taskEditedName'), testContext.get('taskName')]);
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - URL: /control-center
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/control-center')), { timeout: 15000 }).toBe(true);"
    description: The user is on the control center list page
  - intent: Click New Task in the top bar
    action: click
    locator: "getByRole('button', { name: 'New Task' })"
  - intent: Fill the required task title
    action: fill
    locator: locator('#title')
    value: "{{taskName}}"
  - intent: Fill the required task description
    action: fill
    locator: locator('#description')
    value: Task created by automated CRUD test
  - intent: Type a new lead name in the dependency selector
    action: fill
    locator: getByPlaceholder('Select lead')
    value: "{{taskLeadName}}"
  - description: Create the lead on the fly with Use
    js: await page.getByText(`Use "${testContext.get('taskLeadName')}"`).click();
  - intent: Submit the create task form
    action: click
    locator: "getByRole('button', { name: 'Create task' })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('dialog').count() === 0), { timeout: 10000 }).toBe(true);"
    description: The create task modal closes
  - js: "await expect.poll(async () => Boolean(await page.getByText(testContext.get('taskName')).count() > 0), { timeout: 15000 }).toBe(true);"
    description: The new task appears
  - description: Open the task details page
    js: await page.getByText(`${testContext.get('taskName')}`).first().click();
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/control-center/') && !page.url().endsWith('/control-center')), { timeout: 10000 }).toBe(true);"
    description: The control-center details route is open
  - intent: Switch to Details tab
    action: click
    locator: "getByRole('tab', { name: 'Details' })"
  - description: Remember the exact created entity ID and URL for teardown
    js: |-
      testContext.set('taskUrl', page.url());
      await require(process.cwd() + '/tests/support/mutation-fixtures').remember(testContext, 'task');
  - intent: Update the task title
    action: fill
    locator: locator('#title')
    value: "{{taskEditedName}}"
  - intent: Save the basic information section
    action: click
    locator: "getByRole('button', { name: 'Save Basic Information' })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('button', { name: 'Save Basic Information' }).count() > 0), { timeout: 10000 }).toBe(true);"
    description: The save control is idle again
  - description: Require the saved edit to persist after reload
    js: |-
      await page.reload();
      await page.getByRole('tab', { name: 'Details', exact: true }).click();
      await expect(page.locator('#title')).toHaveValue(testContext.get('taskEditedName'));
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'task', testContext.get('taskEditedName'));
  - intent: Click Delete Task in the danger zone
    action: click
    locator: "getByRole('button', { name: 'Delete Task' })"
  - intent: Confirm Delete in the Delete Task dialog
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"
  - js: "await expect.poll(async () => Boolean(await page.getByText(testContext.get('taskEditedName')).count() === 0), { timeout: 15000 }).toBe(true);"
    description: The edited task is gone
  - js: await expect(page.getByText(testContext.get('taskEditedName'))).toHaveCount(0)
    description: The edited task is no longer visible
  - description: Reload the list and wait for loaded data before the final removal check
    js: |-
      await page.goto('/control-center');
      await page.reload();
      await expect(page.locator('.animate-pulse:visible')).toHaveCount(0);
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'task');
tags:
  - regression
  - mutation
teardown:
  - description: Clean up exact run-scoped entities and dependencies even after failure
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/control-center');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
