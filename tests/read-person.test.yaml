goal: Read the People list and details

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /people
  - WAIT_UNTIL: The people page is loaded
    js: "await page.url().endsWith('/people')"
    timeout_seconds: 15

  - intent: Open the first person's details
    action: click
    locator: "locator('table tbody tr:nth-child(1) td').first()"
    
  - intent: Click View or Edit
    action: click
    locator: "getByRole('menuitem', { name: /view|edit|ver|editar/i }).first()"

  - WAIT_UNTIL: The person details page is open
    js: "await page.url().includes('/people/') && !page.url().endsWith('/people')"
    timeout_seconds: 15

  - intent: Return to people list
    action: click
    locator: "getByRole('button', { name: /Back|Volver/i })"
