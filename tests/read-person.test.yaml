goal: Search and read the People results list

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /people
  - WAIT_UNTIL: The people page is loaded
    js: "await page.url().endsWith('/people')"
    timeout_seconds: 15

  - intent: Run the people search to load results
    action: click
    locator: "getByRole('button', { name: /^Search$/i })"

  - WAIT_UNTIL: The people search has finished
    js: "(await page.getByRole('button', { name: /^Search$/i }).count()) > 0"
    timeout_seconds: 30

  - VERIFY: The People search remains available when the external source has no matches
    js: "await expect(page.getByRole('button', { name: /^Search$/i })).toBeVisible()"
