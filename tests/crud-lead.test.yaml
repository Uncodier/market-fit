goal: Complete CRUD cycle for a Lead
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - URL: /projects
  - description: Select the configured test project
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("leadName", `Shiplight Lead ${runId}`);
      testContext.set("leadEditedName", `Shiplight Lead ${runId} Edited`);
      testContext.set("leadEmail", `shiplight.lead.${runId}@example.com`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);

      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'lead', [testContext.get('leadName'), testContext.get('leadEditedName')]);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/robots')), { timeout: 5000 }).toBe(true);"
    description: The user is navigated to the default project page
  - URL: /leads
  - intent: Click Add Lead in the top bar to open the create dialog
    action: click
    locator: "getByRole('button', { name: 'Add Lead' })"
  - intent: Fill the required lead name
    action: fill
    locator: locator('#name')
    value: "{{leadName}}"
  - description: Fill the required lead email with a unique value
    js: await page.locator('#email').fill(testContext.get('leadEmail'))
  - intent: Submit the create lead form
    action: click
    locator: "getByRole('button', { name: 'Create lead' })"
  - js: "await expect.poll(async () => Boolean(await page.getByRole('dialog').count() === 0), { timeout: 10000 }).toBe(true);"
    description: The create lead modal closes
  - js: "await expect.poll(async () => Boolean(await page.getByRole('button', { name: 'Create lead' }).count() === 0), { timeout: 10000 }).toBe(true);"
    description: The create lead modal closes
  - js: "await expect.poll(async () => Boolean((await page.getByText(testContext.get('leadName'), { exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The new lead appears in the list
  - description: Open the run-scoped lead details page
    js: |
      const leadName = testContext.get("leadName");
      await page.getByText(leadName, { exact: true }).first().click();
  - js: "await expect.poll(async () => Boolean((await page.getByRole('heading', { name: testContext.get('leadName'), exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The lead details route is open and loaded
  - description: Remember the created lead route for cleanup
    js: testContext.set('leadUrl', page.url())
  - js: "await expect(page.getByRole('heading', { name: testContext.get('leadName'), exact: true })).toBeVisible()"
    description: The details heading shows the created lead name
  - description: Click the run-scoped lead name to start inline editing
    js: |
      const leadName = testContext.get("leadName");
      await page.getByRole('heading', { name: leadName, exact: true }).click();
  - intent: Replace the lead name with the edited value
    action: fill
    locator: locator('input.h-8')
    value: "{{leadEditedName}}"
  - intent: Save the inline name edit
    action: press
    keys: Enter
  - js: "await expect.poll(async () => Boolean((await page.getByRole('heading', { name: testContext.get('leadEditedName'), exact: true }).count()) > 0), { timeout: 10000 }).toBe(true);"
    description: The heading shows the edited name
  - description: Reload the lead details page to verify persistence
    js: await page.reload()
  - js: "await expect(page.getByRole('heading', { name: testContext.get('leadEditedName'), exact: true })).toBeVisible()"
    description: The edited lead name persists after reload
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'lead', testContext.get('leadEditedName'));
  - intent: Open the lead actions menu
    action: click
    locator: "getByRole('button', { name: 'Open menu' })"
  - intent: Choose Delete Lead
    action: click
    locator: "getByRole('menuitem', { name: 'Delete Lead' })"
  - intent: Confirm lead deletion
    action: click
    locator: "getByRole('button', { name: 'Delete Lead', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/leads')), { timeout: 15000 }).toBe(true);"
    description: The user is back on the leads list
  - description: Reload the leads list before checking deletion
    js: await page.reload()
  - js: "await expect.poll(async () => Boolean((await page.getByPlaceholder('Search leads...').count()) > 0 && (await page.locator('.animate-pulse:visible').count()) === 0), { timeout: 15000 }).toBe(true);"
    description: The leads list has finished loading
  - js: "await expect(page.getByText(testContext.get('leadEditedName'), { exact: true })).toHaveCount(0)"
    description: The deleted lead is absent from the list
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'lead');
teardown:
  - description: Cleanup the exact run-scoped fixture journal, including partial failures
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/leads');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
tags:
  - regression
  - mutation
