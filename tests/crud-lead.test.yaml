goal: Complete CRUD cycle for a Lead

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /leads
  - intent: Click Add Lead in the top bar to open the create dialog
    action: click
    locator: "getByRole('button', { name: 'Add Lead' })"

  - intent: Fill the required lead name
    action: fill
    locator: "locator('#name')"
    value: "Automated Test Lead"

  - description: Fill the required lead email with a unique value
    js: "await page.locator('#email').fill(`shiplight.lead.${Date.now()}@example.com`)"

  - intent: Submit the create lead form
    action: click
    locator: "getByRole('button', { name: 'Create lead' })"

  - WAIT_UNTIL: The create lead modal closes
    js: "page.getByRole('dialog').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The create lead modal closes
    js: "page.getByRole('button', { name: 'Create lead' }).count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new lead appears in the list
    js: "page.getByText('Automated Test Lead').count() > 0"
    timeout_seconds: 15

  - intent: Open the lead details page
    action: click
    locator: "getByText('Automated Test Lead').first()"

  - WAIT_UNTIL: The lead details route is open and loaded
    js: "await page.getByRole('heading', { name: 'Automated Test Lead' }).count() > 0"
    timeout_seconds: 15

  - VERIFY: The details heading shows the created lead name
    js: "await expect(page.getByRole('heading', { name: 'Automated Test Lead' })).toBeVisible()"

  - intent: Click the lead name heading to start inline edit
    action: click
    locator: "getByRole('heading', { name: 'Automated Test Lead' })"

  - intent: Replace the lead name with the edited value
    action: fill
    locator: "locator('input.h-8')"
    value: "Automated Test Lead - Edited"

  - intent: Save the inline name edit
    action: press
    keys: Enter

  - WAIT_UNTIL: The heading shows the edited name
    js: "page.getByRole('heading', { name: 'Automated Test Lead - Edited' }).count() > 0"
    timeout_seconds: 10
