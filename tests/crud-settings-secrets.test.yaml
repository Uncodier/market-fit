goal: Create, read, and delete a run-owned secret
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID before navigation and register a unique run
    js: |-
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('collectionName', `Shiplight secret ${runId}`);
      testContext.set('collectionName', 'SHIPLIGHT_E2E_' + runId.replace(/-/g, '_').toUpperCase());
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind browser and exact fixture backend before creating a run-owned entity
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - description: Wait for the real collection data before creation
    js: await require(process.cwd() + '/tests/support/mutation-collections').prepareCollection(page, testContext, 'secret');
  - intent: Click Add Secret button
    action: click
    locator: "getByRole('button', { name: /Add Secret/i })"
  - js: "await expect.poll(async () => Boolean(await page.locator('div[role=\"dialog\"]').count() > 0), { timeout: 5000 }).toBe(true);"
    description: The Add Secret modal is open
  - intent: Fill Environment Variable Name
    action: fill
    locator: getByPlaceholder('e.g. STRIPE_API_KEY')
    value: "{{collectionName}}"
  - intent: Fill Provider
    action: fill
    locator: getByPlaceholder('e.g. stripe, openai, custom')
    value: shiplight
  - intent: Fill Use Case
    action: fill
    locator: getByPlaceholder('e.g. payments, llm')
    value: e2e
  - intent: Fill Value
    action: fill
    locator: getByPlaceholder('sk_...')
    value: dummy123
  - intent: Click Save Secret
    action: click
    locator: "getByRole('button', { name: /Save Secret/i })"
  - js: "await expect.poll(async () => Boolean(await page.locator('div[role=\"dialog\"]').count() === 0), { timeout: 10000 }).toBe(true);"
    description: The modal is closed
  - js: await expect(page.getByText(testContext.get('collectionName')).first()).toBeVisible()
    description: The secret is visible in the list
  - description: Reload and prove the created run-owned entity persists, saving its ID when exposed
    js: |-
      await page.reload();
      await require(process.cwd() + '/tests/support/mutation-collections').rememberCollection(page, testContext, 'secret');
  - description: Delete only the run-owned entity and assert absence after reload
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'secret', true);
tags:
  - regression
  - mutation
teardown:
  - description: Cleanup only this run-owned entity even when an earlier assertion fails
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'secret');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
