goal: Update and restore Visits settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Visits tab
    action: click
    locator: "getByRole('tab', { name: /Visits/i })"

  - description: Preserve and update the default visit duration
    js: |
      const field = page.locator('#visit-duration');
      const original = await field.inputValue();
      await page.evaluate((value) => sessionStorage.setItem('shiplight:settings:visits', value), original);
      await field.fill(String(Number(original || '60') + 1));

  - intent: Save the updated Visits settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"

  - WAIT_UNTIL: The Visits settings save completes
    js: "await page.waitForTimeout(1000)"
    timeout_seconds: 5

  - intent: Return to the Visits tab after settings refresh
    action: click
    locator: "getByRole('tab', { name: /Visits/i })"

  - description: Restore the original default visit duration
    js: |
      const field = page.locator('#visit-duration');
      const original = await page.evaluate(() => sessionStorage.getItem('shiplight:settings:visits') || '60');
      await field.fill(original);

  - intent: Save the restored Visits settings
    action: click
    locator: "getByRole('button', { name: /^Save$/i }).first()"
