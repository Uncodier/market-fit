goal: Complete CRUD cycle for a Reservation

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /reservations
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/reservations')"
    timeout_seconds: 15

  - intent: Click New reservation in the top bar
    action: click
    locator: "getByRole('button', { name: 'New reservation' })"

  - intent: Fill the reservation name
    action: fill
    locator: "getByRole('textbox').first()"
    value: "Automated Test Reservation"

  - intent: Submit the create reservation form
    action: click
    locator: "getByRole('button', { name: 'Create' })"

  - WAIT_UNTIL: The create modal closes
    js: "await page.locator('div[role="dialog"]').count() === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The reservation details page is open
    js: "await page.url().includes('/reservations/') && !page.url().endsWith('/reservations')"
    timeout_seconds: 15

  - VERIFY: The created reservation name is visible
    js: "await expect(page.getByText('Automated Test Reservation').first()).toBeVisible()"

  - intent: Click Delete on the details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' }).last()"

  - WAIT_UNTIL: The user is back on the list
    js: "await page.url().endsWith('/reservations')"
    timeout_seconds: 15

  - VERIFY: The reservation is gone from the list
    js: "await expect(page.getByText('Automated Test Reservation')).toHaveCount(0)"
