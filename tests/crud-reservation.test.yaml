goal: Open and validate the Reservation creation flow

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /reservations
  - WAIT_UNTIL: The page is loaded
    js: "await page.url().endsWith('/reservations')"
    timeout_seconds: 15

  - intent: Open the reservation creation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Reservation' }).first()"

  - VERIFY: The service selector is visible
    js: "await expect(page.getByPlaceholder(/Select a reservable service/i)).toBeVisible()"

  - VERIFY: The customer selector is visible
    js: "await expect(page.getByPlaceholder(/Select customer/i)).toBeVisible()"

  - intent: Close the reservation creation dialog
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: /^Cancel$/i })"

  - VERIFY: The reservation creation dialog is closed
    js: "await expect(page.getByRole('dialog')).toHaveCount(0)"
