goal: Open and read the Reservation creation dialog without creating a reservation

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /reservations
  - description: Require the loaded /reservations read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/reservations');

  - intent: Open the reservation creation dialog
    action: click
    locator: "getByRole('button', { name: 'Create Reservation' }).first()"

  - description: The service selector is visible
    js: |
      await expect(page.getByRole('dialog')).toBeVisible();
      await expect(page.getByRole('dialog').getByPlaceholder(/Select a reservable service/i)).toBeVisible();

  - description: The customer selector is visible
    js: "await expect(page.getByPlaceholder(/Select customer/i)).toBeVisible()"

  - intent: Close the reservation creation dialog
    action: click
    locator: "getByRole('dialog').getByRole('button', { name: /^Cancel$/i })"

  - description: The reservation creation dialog is closed
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await expect(page.getByRole('dialog')).toHaveCount(0);
      await assertReadRoute(page, '/reservations');

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
