goal: Create, read, and delete a run-owned calendar
statements:
  - description: Require explicit TEST_SITE_NAME and TEST_SITE_ID before navigation and register a unique run
    js: |-
      require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set('collectionName', `Shiplight calendar ${runId}`);
      testContext.set('collectionSlug', 'shiplight-' + runId);
      require(process.cwd() + '/tests/support/mutation-safety').required(process.env, 'TEST_CALENDAR_MEMBER_EMAIL');
  - description: Select and verify the explicit workspace
    js: |-
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the UI account and fixture backend before any mutation
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - description: Wait for the real collection data before creation
    js: await require(process.cwd() + '/tests/support/mutation-collections').prepareCollection(page, testContext, 'calendar');
  - intent: Click Add Calendar button
    action: click
    locator: "getByRole('button', { name: 'Add Calendar' })"
  - intent: Fill Calendar Name
    action: fill
    locator: locator('#rr-name-new')
    value: "{{collectionName}}"
  - intent: Fill Calendar Slug
    action: fill
    locator: locator('#rr-slug-new')
    value: "{{collectionSlug}}"
  - description: Assign only the explicitly configured disposable calendar member
    js: |-
      const email = require(process.cwd() + '/tests/support/mutation-safety').required(process.env, 'TEST_CALENDAR_MEMBER_EMAIL');
      await page.locator('[id=' + JSON.stringify('member-new-' + email) + ']').click();
  - intent: Create the calendar
    action: click
    locator: "getByRole('button', { name: 'Create Calendar' })"
  - js: "await expect(page.getByText('Calendar saved successfully')).toBeVisible({ timeout: 15000 })"
    description: The calendar save completes
  - js: await expect(page.getByText(testContext.get('collectionName')).first()).toBeVisible()
    description: The calendar is visible before reload
  - URL: /settings?tab=calendar
  - js: await expect(page.getByText(testContext.get('collectionName')).first()).toBeVisible()
    description: The calendar is visible in the list
  - description: Reload and prove the created run-owned entity persists, saving its ID when exposed
    js: |-
      await page.reload();
      await require(process.cwd() + '/tests/support/mutation-collections').rememberCollection(page, testContext, 'calendar');
  - description: Delete only the run-owned entity and assert absence after reload
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'calendar', true);
tags:
  - regression
  - mutation
teardown:
  - description: Cleanup only this run-owned entity even when an earlier assertion fails
    js: await require(process.cwd() + '/tests/support/mutation-collections').removeCollection(page, testContext, 'calendar');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
