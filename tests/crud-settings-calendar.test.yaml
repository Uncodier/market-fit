goal: Complete CRUD cycle for a Calendar in Settings

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /settings
  - WAIT_UNTIL: The settings page is loaded
    js: "await page.url().endsWith('/settings')"
    timeout_seconds: 15

  - intent: Click Calendar tab
    action: click
    locator: "getByRole('tab', { name: /Calendar/i })"

  - intent: Click Add Calendar button
    action: click
    locator: "getByRole('button', { name: 'Add Calendar' })"

  - intent: Fill Calendar Name
    action: fill
    locator: "locator('#rr-name-new')"
    value: "Shiplight E2E Calendar"

  - intent: Fill Calendar Slug
    action: fill
    locator: "locator('#rr-slug-new')"
    value: "shiplight-e2e-calendar"

  - intent: Assign the first team member
    action: click
    locator: "locator('button[role=\"checkbox\"][id^=\"member-new-\"]').first()"

  - description: Create the calendar
    js: "await page.getByRole('button', { name: 'Create Calendar' }).evaluate((button) => button.click())"

  - WAIT_UNTIL: The calendar creation finishes
    js: "(await page.waitForTimeout(3000)) === undefined"
    timeout_seconds: 15

  - URL: /settings?tab=calendar

  - VERIFY: The calendar is visible in the list
    js: "await expect(page.getByText('Shiplight E2E Calendar').first()).toBeVisible()"

  - intent: Expand the E2E calendar
    action: click
    locator: "getByText('Shiplight E2E Calendar').first()"

  - intent: Click Delete on the calendar row
    action: click
    locator: "getByRole('button', { name: 'Remove Calendar' })"

  - WAIT_UNTIL: The delete confirmation modal is open
    js: "await page.getByRole('alertdialog').count() > 0"
    timeout_seconds: 5

  - intent: Confirm deletion
    action: click
    locator: "getByRole('button', { name: 'Delete' })"

  - VERIFY: The E2E calendar is removed
    js: "await expect(page.getByText('Shiplight E2E Calendar')).toHaveCount(0)"
