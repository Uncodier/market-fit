goal: Read every Context workspace

statements:
  - description: Select the exact configured workspace and validate its ID
    js: |
      const { selectWorkspace } = require(process.cwd() + '/tests/support/workspace');
      await selectWorkspace(page);

  - URL: /context
  - description: Require the loaded /context read surface
    js: |
      const { assertReadRoute } = require(process.cwd() + '/tests/support/read-navigation');
      await assertReadRoute(page, '/context');

  - description: Branding is selected by default
    js: |
      await expect(page.getByRole('tab', { name: 'Branding', exact: true })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('#context-form').getByPlaceholder('We are...')).toBeVisible();

  - intent: Open Marketing context
    action: click
    locator: "getByRole('tab', { name: 'Marketing' }).first()"
  - description: Marketing context is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Marketing', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/context', page.locator('#context-form #ai-focus-mode'));

  - intent: Open Copy Sequences context
    action: click
    locator: "getByRole('tab', { name: 'Copy Sequences' }).first()"
  - description: Copy Sequences context is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Copy Sequences', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/context', page.locator('#copywriting-collection').getByRole('heading', { name: 'Copy Sequences', exact: true }));

  - intent: Open Customer Journey context
    action: click
    locator: "getByRole('tab', { name: 'Customer Journey' }).first()"
  - description: Customer Journey context is selected
    js: |
      const { assertReadReady } = require(process.cwd() + '/tests/support/read-assertions');
      await expect(page.getByRole('tab', { name: 'Customer Journey', exact: true })).toHaveAttribute('aria-selected', 'true');
      await assertReadReady(page, '/context', page.locator('#journey-awareness'));

  - description: Fail on observed application or dependency read errors
    js: |
      const { assertReadObservation } = require(process.cwd() + '/tests/support/read-observation');
      await assertReadObservation(page);
