goal: Read every Context workspace

statements:
  - URL: /projects
  - intent: Select the first available project
    action: click
    locator: "getByRole('button', { name: 'Select' }).first()"

  - WAIT_UNTIL: The workspace is selected
    js: "await page.url().includes('/robots')"
    timeout_seconds: 10

  - URL: /context
  - WAIT_UNTIL: Context tabs are ready
    js: "await page.getByRole('tab', { name: 'Branding' }).count() > 0"
    timeout_seconds: 15

  - VERIFY: Branding is selected by default
    js: "await expect(page.getByRole('tab', { name: 'Branding' }).first()).toHaveAttribute('data-state', 'active')"

  - intent: Open Marketing context
    action: click
    locator: "getByRole('tab', { name: 'Marketing' }).first()"
  - VERIFY: Marketing context is selected
    js: "await expect(page.getByRole('tab', { name: 'Marketing' }).first()).toHaveAttribute('data-state', 'active')"

  - intent: Open Copy Sequences context
    action: click
    locator: "getByRole('tab', { name: 'Copy Sequences' }).first()"
  - VERIFY: Copy Sequences context is selected
    js: "await expect(page.getByRole('tab', { name: 'Copy Sequences' }).first()).toHaveAttribute('data-state', 'active')"

  - intent: Open Customer Journey context
    action: click
    locator: "getByRole('tab', { name: 'Customer Journey' }).first()"
  - VERIFY: Customer Journey context is selected
    js: "await expect(page.getByRole('tab', { name: 'Customer Journey' }).first()).toHaveAttribute('data-state', 'active')"
