goal: Complete CRUD cycle for a Sale

statements:
  - URL: /projects
  - description: Select the configured test project
    js: |
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("saleName", `Shiplight Sale ${runId}`);
      testContext.set("saleEditedName", `Shiplight Sale ${runId} Edited`);
      testContext.set("saleProductName", `Shiplight Sale Product ${runId}`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      await page.getByRole('button', { name: `Select ${siteName}`, exact: true }).click();

  - WAIT_UNTIL: The user is navigated to the default project page
    js: "await page.url().includes('/robots')"
    timeout_seconds: 5

  - URL: /sales
  - intent: Click Add Sale in the top bar
    action: click
    locator: "getByRole('button', { name: 'Add Sale' })"

  - intent: Fill the sale title
    action: fill
    locator: "locator('#title')"
    value: "{{saleName}}"

  - intent: Fill the product name
    action: fill
    locator: "locator('#productName')"
    value: "{{saleProductName}}"

  - intent: Open product type dropdown
    action: click
    locator: "getByRole('combobox').first()"

  - description: Wait for the product type dropdown animation
    js: "await page.waitForTimeout(500)"

  - intent: Select product type
    action: click
    locator: "getByRole('option', { name: 'Service' })"

  - intent: Fill the amount
    action: fill
    locator: "locator('input#amount')"
    value: "100"

  - intent: Submit the create sale form
    action: click
    locator: "getByRole('button', { name: 'Create sale' })"

  - WAIT_UNTIL: The create sale modal closes
    js: "(await page.getByRole('dialog').count()) === 0"
    timeout_seconds: 10

  - WAIT_UNTIL: The new sale appears in the list
    js: "(await page.getByRole('row').filter({ hasText: testContext.get('saleProductName') }).count()) > 0"
    timeout_seconds: 15

  - description: Open the run-scoped sale details page
    js: |
      const productName = testContext.get("saleProductName");
      await page.getByRole('row').filter({ hasText: productName }).click();

  - WAIT_UNTIL: The sale details route is open and loaded
    js: "(await page.getByText(testContext.get('saleName'), { exact: true }).count()) > 0"
    timeout_seconds: 15

  - description: Remember the created sale route for cleanup
    js: "testContext.set('saleUrl', page.url())"

  - VERIFY: The sale title is visible on the details page
    js: "await expect(page.getByText(testContext.get('saleName'), { exact: true }).first()).toBeVisible()"

  - intent: Open the sale edit dialog
    action: click
    locator: "getByRole('button', { name: 'Edit', exact: true })"

  - WAIT_UNTIL: The sale edit dialog is ready
    js: "(await page.getByRole('dialog', { name: 'Edit Sale' }).count()) > 0"
    timeout_seconds: 10

  - intent: Update the sale title
    action: fill
    locator: "getByRole('dialog', { name: 'Edit Sale' }).getByLabel('Title')"
    value: "{{saleEditedName}}"

  - intent: Save the sale update
    action: click
    locator: "getByRole('dialog', { name: 'Edit Sale' }).getByRole('button', { name: 'Update sale' })"

  - WAIT_UNTIL: The sale update dialog closes
    js: "(await page.getByRole('dialog', { name: 'Edit Sale' }).count()) === 0"
    timeout_seconds: 20

  - WAIT_UNTIL: The edited sale title is visible
    js: "(await page.getByText(testContext.get('saleEditedName'), { exact: true }).count()) > 0"
    timeout_seconds: 15

  - description: Reload the sale details page to verify persistence
    js: "await page.reload()"

  - WAIT_UNTIL: The reloaded sale details are ready
    js: "(await page.getByText(testContext.get('saleEditedName'), { exact: true }).count()) > 0"
    timeout_seconds: 15

  - VERIFY: The edited sale title persists after reload
    js: "await expect(page.getByText(testContext.get('saleEditedName'), { exact: true }).first()).toBeVisible()"

  - intent: Click Delete on the sale details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete', exact: true }).first()"

  - intent: Confirm sale deletion
    action: click
    locator: "getByRole('alertdialog').getByRole('button', { name: 'Delete', exact: true })"

  - WAIT_UNTIL: The user is back on the sales list
    js: "await page.url().endsWith('/sales')"
    timeout_seconds: 30

  - description: Reload the sales list before checking deletion
    js: "await page.reload()"

  - WAIT_UNTIL: The sales list has finished loading
    js: "(await page.getByPlaceholder('Search sales...').count()) > 0"
    timeout_seconds: 30

  - VERIFY: The deleted sale is absent from the list
    js: "await expect(page.getByRole('row').filter({ hasText: testContext.get('saleProductName') })).toHaveCount(0)"

teardown:
  - description: Check the created sale route for cleanup
    js: |
      const saleUrl = testContext.get("saleUrl");
      let saleNeedsCleanup = false;
      if (saleUrl) {
        await page.goto(saleUrl);
        saleNeedsCleanup = await page.getByRole('button', { name: 'Delete', exact: true }).first()
          .waitFor({ state: 'visible', timeout: 5000 })
          .then(() => true)
          .catch(() => false);
      }
      testContext.set("saleNeedsCleanup", saleNeedsCleanup);

  - IF: "js: testContext.get('saleNeedsCleanup') === true"
    THEN:
      - intent: Delete the surviving run-scoped sale
        action: click
        locator: "getByRole('button', { name: 'Delete', exact: true }).first()"
      - intent: Confirm cleanup of the run-scoped sale
        action: click
        locator: "getByRole('alertdialog').getByRole('button', { name: 'Delete', exact: true })"
      - WAIT_UNTIL: The cleanup returns to the sales list
        js: "page.url().endsWith('/sales')"
        timeout_seconds: 30

  - URL: /sales

  - WAIT_UNTIL: The sales list is ready for fallback cleanup
    js: "(await page.getByPlaceholder('Search sales...').count()) > 0"
    timeout_seconds: 30

  - IF: "js: Boolean(testContext.get('saleProductName')) && (await page.getByRole('row').filter({ hasText: testContext.get('saleProductName') }).count()) > 0"
    THEN:
      - description: Open the surviving run-scoped sale from the list
        js: |
          const productName = testContext.get("saleProductName");
          await page.getByRole('row').filter({ hasText: productName }).click();
      - WAIT_UNTIL: The sale details route is ready for cleanup
        js: "/\\/sales\\/[^/]+$/.test(page.url())"
        timeout_seconds: 15
      - intent: Delete the surviving run-scoped sale
        action: click
        locator: "getByRole('button', { name: 'Delete', exact: true }).first()"
      - intent: Confirm fallback cleanup of the run-scoped sale
        action: click
        locator: "getByRole('alertdialog').getByRole('button', { name: 'Delete', exact: true })"
