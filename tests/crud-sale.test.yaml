goal: Complete CRUD cycle for a Sale
statements:
  - description: Require TEST_SITE_NAME and TEST_SITE_ID and an explicit disposable mutation target before navigation
    js: require(process.cwd() + '/tests/support/mutation-safety').requireMutationEnvironment();
  - URL: /projects
  - description: Select the configured test project
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').fixtureClient();
      const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      testContext.set("saleName", `Shiplight Sale ${runId}`);
      testContext.set("saleEditedName", `Shiplight Sale ${runId} Edited`);
      testContext.set("saleProductName", `Shiplight Sale Product ${runId}`);
      const siteName = process.env.TEST_SITE_NAME;
      if (!siteName) throw new Error("TEST_SITE_NAME is required");
      await require(process.cwd() + '/tests/support/workspace').selectWorkspace(page);

      require(process.cwd() + '/tests/support/mutation-fixtures').own(testContext, 'sale', [testContext.get('saleName'), testContext.get('saleEditedName')]);
      testContext.set("mutationObservationStarted", true);
  - description: Bind the browser session to the explicitly selected cleanup backend and account
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').bindBrowserFixture(page);
  - js: "await expect.poll(async () => Boolean(await page.url().includes('/robots')), { timeout: 5000 }).toBe(true);"
    description: The user is navigated to the default project page
  - URL: /sales
  - intent: Click Add Sale in the top bar
    action: click
    locator: "getByRole('button', { name: 'Add Sale' })"
  - intent: Fill the sale title
    action: fill
    locator: locator('#title')
    value: "{{saleName}}"
  - intent: Fill the product name
    action: fill
    locator: locator('#productName')
    value: "{{saleProductName}}"
  - intent: Open product type dropdown
    action: click
    locator: getByRole('combobox').first()
  - intent: Select product type
    action: click
    locator: "getByRole('option', { name: 'Service' })"
  - intent: Fill the amount
    action: fill
    locator: locator('input#amount')
    value: "100"
  - intent: Submit the create sale form
    action: click
    locator: "getByRole('button', { name: 'Create sale' })"
  - js: "await expect.poll(async () => Boolean((await page.getByRole('dialog').count()) === 0), { timeout: 10000 }).toBe(true);"
    description: The create sale modal closes
  - js: "await expect.poll(async () => Boolean((await page.getByRole('row').filter({ hasText: testContext.get('saleProductName') }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The new sale appears in the list
  - description: Open the run-scoped sale details page
    js: |
      const productName = testContext.get("saleProductName");
      await page.getByRole('row').filter({ hasText: productName }).click();
  - js: "await expect.poll(async () => Boolean((await page.getByText(testContext.get('saleName'), { exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The sale details route is open and loaded
  - description: Remember the created sale route for cleanup
    js: testContext.set('saleUrl', page.url())
  - js: "await expect(page.getByText(testContext.get('saleName'), { exact: true }).first()).toBeVisible()"
    description: The sale title is visible on the details page
  - intent: Open the sale edit dialog
    action: click
    locator: "getByRole('button', { name: 'Edit', exact: true })"
  - js: "await expect.poll(async () => Boolean((await page.getByRole('dialog', { name: 'Edit Sale' }).count()) > 0), { timeout: 10000 }).toBe(true);"
    description: The sale edit dialog is ready
  - intent: Update the sale title
    action: fill
    locator: "getByRole('dialog', { name: 'Edit Sale' }).getByLabel('Title')"
    value: "{{saleEditedName}}"
  - intent: Save the sale update
    action: click
    locator: "getByRole('dialog', { name: 'Edit Sale' }).getByRole('button', { name: 'Update sale' })"
  - js: "await expect.poll(async () => Boolean((await page.getByRole('dialog', { name: 'Edit Sale' }).count()) === 0), { timeout: 20000 }).toBe(true);"
    description: The sale update dialog closes
  - js: "await expect.poll(async () => Boolean((await page.getByText(testContext.get('saleEditedName'), { exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The edited sale title is visible
  - description: Reload the sale details page to verify persistence
    js: await page.reload()
  - js: "await expect.poll(async () => Boolean((await page.getByText(testContext.get('saleEditedName'), { exact: true }).count()) > 0), { timeout: 15000 }).toBe(true);"
    description: The reloaded sale details are ready
  - js: "await expect(page.getByText(testContext.get('saleEditedName'), { exact: true }).first()).toBeVisible()"
    description: The edited sale title persists after reload
  - description: Require the exact updated entity to persist under its saved ID in the selected site
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertPersisted(testContext, 'sale', testContext.get('saleEditedName'));
  - intent: Click Delete on the sale details toolbar
    action: click
    locator: "getByRole('button', { name: 'Delete', exact: true }).first()"
  - intent: Confirm sale deletion
    action: click
    locator: "getByRole('alertdialog').getByRole('button', { name: 'Delete', exact: true })"
  - js: "await expect.poll(async () => Boolean(await page.url().endsWith('/sales')), { timeout: 30000 }).toBe(true);"
    description: The user is back on the sales list
  - description: Reload the sales list before checking deletion
    js: await page.reload()
  - js: "await expect.poll(async () => Boolean((await page.getByPlaceholder('Search sales...').count()) > 0 && (await page.locator('.animate-pulse:visible').count()) === 0), { timeout: 30000 }).toBe(true);"
    description: The sales list has finished loading
  - js: "await expect(page.getByRole('row').filter({ hasText: testContext.get('saleProductName') })).toHaveCount(0)"
    description: The deleted sale is absent from the list
  - description: Verify removal by saved entity ID before cleanup can change the outcome
    js: await require(process.cwd() + '/tests/support/mutation-fixtures').assertRemoved(testContext, 'sale');
teardown:
  - description: Cleanup the exact run-scoped fixture journal, including partial failures
    js: |-
      await require(process.cwd() + '/tests/support/mutation-fixtures').cleanup(testContext);
      if (testContext.get('mutationJournal')) await page.goto('/sales');
  - description: Fail on observed HTTP, application, network, or console errors even when UI assertions passed
    js: if (testContext.get("mutationObservationStarted")) await require(process.cwd() + '/tests/support/read-observation').assertReadObservation(page);
tags:
  - regression
  - mutation
